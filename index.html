<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIX 홍대 모듈 로드맵</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 홈페이지형 — 상단 고정 메뉴, 화면 가득한 첫 화면, 스튜디오 소개 카드, 띠(band) 단위 섹션, 하단 사이트 푸터 */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface2:#F0F3F6; --ink:#0B1626; --text:#38465A; --muted:#6D7889;
  --line:#DCE2E9; --line2:#EBEEF2; --navy:#183D70; --navy-s:rgba(24,61,112,.07); --blue:#2C6DB5; --blue-s:rgba(44,109,181,.08);
  --brass:#946E1F; --brass-b:#C29B48; --brass-s:rgba(194,155,72,.15); --danger:#B4303E; --danger-s:rgba(180,48,62,.09);
  --ok:#2C7A57; --ok-s:rgba(44,122,87,.1); --memo:#FFF5D6; --memo-ink:#6B5212; --focus:#2F6FD1;
  --head-bg:rgba(255,255,255,.84); --hero:#08121F; --hero2:#10223A; --hero-fg:#F2F5F9; --hero-mut:#A9B6C8;
  --shadow:0 1px 2px rgba(11,22,38,.04),0 12px 32px rgba(11,22,38,.07);
  --shadow-h:0 2px 4px rgba(11,22,38,.05),0 24px 48px rgba(11,22,38,.12);
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --wrap:1180px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1018; --surface:#101925; --surface2:#152131; --ink:#F0F3F7; --text:#C5CEDA; --muted:#8794A6;
  --line:#243246; --line2:#1A2636; --navy:#A5C4EA; --navy-s:rgba(165,196,234,.08); --blue:#86B6EC; --blue-s:rgba(134,182,236,.1);
  --brass:#DDB76A; --brass-b:#DDB76A; --brass-s:rgba(221,183,106,.13); --danger:#EE7F8A; --danger-s:rgba(238,127,138,.12);
  --ok:#72CDA1; --ok-s:rgba(114,205,161,.12); --memo:#2E2814; --memo-ink:#E8D49A; --focus:#86B6EC;
  --head-bg:rgba(10,16,24,.82); --hero:#060C15; --hero2:#0E1D31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28); --shadow-h:0 2px 4px rgba(0,0,0,.3),0 24px 48px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1018; --surface:#101925; --surface2:#152131; --ink:#F0F3F7; --text:#C5CEDA; --muted:#8794A6;
  --line:#243246; --line2:#1A2636; --navy:#A5C4EA; --navy-s:rgba(165,196,234,.08); --blue:#86B6EC; --blue-s:rgba(134,182,236,.1);
  --brass:#DDB76A; --brass-b:#DDB76A; --brass-s:rgba(221,183,106,.13); --danger:#EE7F8A; --danger-s:rgba(238,127,138,.12);
  --ok:#72CDA1; --ok-s:rgba(114,205,161,.12); --memo:#2E2814; --memo-ink:#E8D49A; --focus:#86B6EC;
  --head-bg:rgba(10,16,24,.82); --hero:#060C15; --hero2:#0E1D31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28); --shadow-h:0 2px 4px rgba(0,0,0,.3),0 24px 48px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.7;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--head-bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* ---------- 상단 메뉴 ---------- */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--head-bg);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line2)}
.head .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:left;flex:none}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--hero);display:grid;place-items:center;position:relative;overflow:hidden}
.logo .mk::before{content:"";position:absolute;inset:7px;border:1.5px solid var(--brass-b);border-radius:3px;transform:rotate(45deg)}
.logo .mk::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass-b)}
.logo .lt{font-family:var(--f-display);font-weight:900;font-size:16.5px;color:var(--ink);line-height:1.15;letter-spacing:-.03em}
.logo .ls{font-size:11px;color:var(--muted);letter-spacing:.02em}
.menu{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{background:none;border:0;padding:8px 13px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--text);white-space:nowrap;position:relative}
.menu button:hover{color:var(--ink);background:var(--surface2)}
.menu button.on{color:var(--ink);font-weight:700}
.menu button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:1px;height:2px;border-radius:2px;background:var(--mc,var(--brass-b))}
.menu .lockt{font-size:9.5px;color:var(--muted);margin-left:4px;vertical-align:top}
.hright{display:flex;align-items:center;gap:8px;flex:none}
.hbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.hbtn:hover{border-color:var(--muted);color:var(--ink)}
.hbtn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.hbtn.icon{width:34px;height:34px;padding:0;justify-content:center}
.chipu{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);font-weight:600}
.chipu .av{width:30px;height:30px;border-radius:50%;background:var(--hero);color:var(--brass-b);display:grid;place-items:center;font-family:var(--f-display);font-size:13px}
.chipu small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;line-height:1.1}
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-h);padding:6px;min-width:240px;z-index:60}
.dd-menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 11px;font-size:13.5px}
.dd-menu button:hover{background:var(--surface2)}
.dd-menu hr{border:0;border-top:1px solid var(--line2);margin:5px 0}

/* ---------- 첫 화면 ---------- */
.hero{background:var(--hero);color:var(--hero-fg);position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-20%;z-index:-2;background:
  radial-gradient(40% 55% at 82% 18%,color-mix(in srgb,var(--c1,#C29B48) 55%,transparent),transparent 70%),
  radial-gradient(35% 50% at 62% 92%,color-mix(in srgb,var(--c2,#2E8BC7) 45%,transparent),transparent 70%),
  radial-gradient(30% 40% at 100% 70%,color-mix(in srgb,var(--c3,#7B68B5) 40%,transparent),transparent 70%);filter:blur(10px);opacity:.75}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(100deg,transparent 15%,#000 75%)}
.hero .wrap{padding-block:88px 72px}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.2em;color:var(--brass-b);text-transform:uppercase;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:28px;height:1px;background:var(--brass-b)}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,5.2vw,62px);line-height:1.18;margin:20px 0 18px;letter-spacing:-.035em;color:#fff;max-width:900px;text-wrap:balance}
.hero p.lead{margin:0;color:var(--hero-mut);font-size:clamp(15px,1.6vw,18px);max-width:680px;line-height:1.75}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.hero .meta>span{font-size:13px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px;color:var(--hero-fg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:48px;border-top:1px solid rgba(255,255,255,.12);max-width:820px}
.stats div{padding:18px 18px 0 0}
.stats b{display:block;font-family:var(--f-display);font-size:clamp(28px,3.6vw,42px);color:#fff;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--hero-mut)}
.scroll-cue{margin-top:40px;display:inline-flex;align-items:center;gap:10px;font-size:12.5px;color:var(--hero-mut);background:none;border:0;padding:0}
.scroll-cue i{width:26px;height:40px;border:1.5px solid rgba(255,255,255,.3);border-radius:14px;position:relative}
.scroll-cue i::after{content:"";position:absolute;left:50%;top:8px;width:3px;height:7px;border-radius:2px;background:var(--brass-b);transform:translateX(-50%);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translate(-50%,0);opacity:1}60%{transform:translate(-50%,12px);opacity:0}}

/* ---------- 띠 섹션 ---------- */
.band{padding-block:84px}
.band.alt{background:var(--surface)}
.band.tight{padding-block:56px}
.bh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 22px;align-items:end;margin-bottom:38px;position:relative}
.bh .no{font-family:var(--f-display);font-size:56px;font-weight:900;line-height:.9;color:transparent;-webkit-text-stroke:1.2px var(--brass-b);grid-row:span 2}
.bh .ey{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--brass);text-transform:uppercase}
.bh h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3vw,34px);color:var(--ink);letter-spacing:-.03em;line-height:1.25;text-wrap:balance}
.bh .sub{font-size:13px;color:var(--muted);align-self:end;text-align:right}
.blk{position:relative}
.blk+.blk{margin-top:40px}
.blk-t{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.01em;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.blk-t::before{content:"";width:16px;height:2px;background:var(--brass-b);border-radius:2px}

/* 블록 */
.callout{border-radius:16px;padding:20px 24px;font-size:16px;background:var(--blue-s);color:var(--ink);line-height:1.7}
.callout.concept{background:var(--hero);color:#fff;font-family:var(--f-display);font-weight:700;font-size:clamp(19px,2.4vw,26px);letter-spacing:-.025em;padding:30px 32px;text-align:center}
.callout.summary{background:none;border-left:3px solid var(--brass-b);border-radius:0;padding:4px 0 4px 22px;font-size:15px;color:var(--text)}
.callout.plain{background:none;padding:0;font-size:15px;color:var(--text)}
.bul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.bul li{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:18px 18px 18px 46px;font-size:14.5px}
.band.alt .bul li{background:var(--bg)}
.bul li::before{content:"";position:absolute;left:20px;top:26px;width:8px;height:8px;border:1.5px solid var(--brass-b);transform:rotate(45deg)}
.flow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:18px}
.fcol{border-radius:18px;padding:20px;background:var(--surface);border:1px solid var(--line2);position:relative;min-width:0}
.band.alt .fcol{background:var(--bg)}
.fcol .fl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:12px;padding-right:56px}
.fcol.tool .fl{color:var(--navy)}.fcol.mod .fl{color:var(--blue)}.fcol.proj .fl{color:var(--brass)}
.fcol.proj{background:var(--hero);border-color:var(--hero)}
.fcol.proj .chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}
.fcol.proj .fl{color:var(--brass-b)}
.fcol .chip{display:block;background:var(--surface2);border:1px solid transparent;border-radius:11px;padding:10px 13px;margin-top:7px;font-size:14px;font-weight:600;color:var(--ink);position:relative}
.fcol .chip small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.fcol.proj .chip small{color:var(--hero-mut)}
.flow-step{position:absolute;top:50%;right:-15px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--brass-b);color:#fff;display:grid;place-items:center;font-size:13px;z-index:2;box-shadow:0 0 0 4px var(--bg)}
.band.alt .flow-step{box-shadow:0 0 0 4px var(--surface)}
.note-line{font-size:13px;color:var(--muted);margin:14px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.tile{border-radius:18px;padding:26px;background:var(--surface);border:1px solid var(--line2);position:relative;transition:transform .2s,box-shadow .2s}
.band.alt .tile{background:var(--bg)}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tile .tn{font-family:var(--f-display);font-size:40px;font-weight:900;color:transparent;-webkit-text-stroke:1.2px var(--brass-b);line-height:1;margin-bottom:18px}
.tile h4{margin:0 0 6px;font-size:17px;color:var(--ink);font-family:var(--f-display);letter-spacing:-.02em}
.tile p{margin:0;font-size:14px}
.tiles.eff{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tiles.eff .tile{background:none;border:0;border-top:2px solid var(--ink);border-radius:0;padding:18px 2px 4px}
.tiles.eff .tile:hover{transform:none;box-shadow:none}
.tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line2);background:var(--surface)}
.band.alt .tbl-wrap{background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:600px}
thead th{color:var(--muted);font-weight:600;font-size:12px;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.03em}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
td.strong{font-weight:700;color:var(--ink)}
td.arrow{color:var(--brass-b);text-align:center;width:36px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.b-new{color:var(--navy);background:var(--navy-s)}.b-remake{color:var(--blue);background:var(--blue-s)}
.b-reg{color:var(--brass);background:var(--brass-s)}.b-drop{color:var(--danger);background:var(--danger-s)}
.b-rec{color:var(--blue);border-color:currentColor}
.col-tools{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.col-tools select{font-size:11px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:20px}
.mcard{border-radius:20px;background:var(--surface);border:1px solid var(--line2);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .2s,box-shadow .2s}
.band.alt .mcard{background:var(--bg)}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.mcard .top{padding:24px 24px 18px;position:relative}
.mcard.mod .top{background:linear-gradient(160deg,var(--blue-s),transparent 80%)}
.mcard.tool .top{background:linear-gradient(160deg,var(--navy-s),transparent 80%)}
.mcard .code{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--blue)}
.mcard.tool .code{color:var(--navy)}
.mcard h4{margin:10px 0 8px;font-family:var(--f-display);font-size:20px;color:var(--ink);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;letter-spacing:-.03em;line-height:1.3}
.mcard .hrs{font-family:var(--f-mono);font-size:11.5px;color:var(--brass);background:var(--brass-s);border-radius:999px;padding:1px 10px;font-weight:600}
.mcard .tag{margin:0;font-size:14px}
.mcard .body{padding:6px 24px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;font-size:13.5px;position:relative;padding-top:10px;border-top:1px solid var(--line2)}
.kv .k{font-weight:700;color:var(--muted);font-size:12px;padding-top:1px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 11px;position:relative;background:var(--surface)}
.result{background:var(--brass-s);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--ink)}
.result b{color:var(--brass)}
.todo{font-size:12.5px;background:var(--memo);color:var(--memo-ink);border-radius:10px;padding:8px 12px}
.from{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:6px}
.aibox{border-radius:22px;padding:34px;background:var(--hero);color:var(--hero-fg);position:relative;overflow:hidden;isolation:isolate}
.aibox::before{content:"";position:absolute;right:-10%;top:-40%;width:60%;height:140%;z-index:-1;background:radial-gradient(closest-side,rgba(194,155,72,.25),transparent)}
.aibox .tagline{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--brass-b);margin-bottom:12px}
.aibox>p{color:var(--hero-mut);margin:0 0 6px;font-size:15px}
.aibox .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:18px 0}
.aibox .it{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 18px;position:relative}
.aibox .it b{color:#fff;display:block;margin-bottom:3px}
.aibox .it span{font-size:13.5px;color:var(--hero-mut)}
.aibox .concl{font-family:var(--f-display);font-weight:700;color:#fff;margin:8px 0 0;font-size:17px}
.aibox .foot{font-size:12.5px;color:var(--hero-mut);margin-top:12px;border-top:1px dashed rgba(255,255,255,.15);padding-top:12px}

/* ---------- 로드맵 홈 ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.scard{position:relative;text-align:left;border:0;border-radius:22px;padding:26px 22px 22px;min-height:290px;color:#fff;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 92%,#fff 8%),color-mix(in srgb,var(--c) 55%,#050B14));transition:transform .25s,box-shadow .25s}
.scard::before{content:"";position:absolute;right:-30%;top:-25%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.25);z-index:-1}
.scard::after{content:"";position:absolute;right:-12%;top:-8%;width:55%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.18);z-index:-1}
.scard:hover{transform:translateY(-6px);box-shadow:0 26px 50px color-mix(in srgb,var(--c) 40%,transparent)}
.scard .si{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;opacity:.8}
.scard .sn{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.2;margin-top:auto;letter-spacing:-.03em}
.scard .ss{font-size:13px;opacity:.85}
.scard .sc{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.scard .sc span{font-size:11px;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 9px;white-space:nowrap}
.scard .sf{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.fcard{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:26px;position:relative;transition:transform .2s,box-shadow .2s}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.fcard .ftag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;color:var(--blue)}
.fcard .ft{font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--ink);line-height:1.2;margin-top:8px;display:flex;align-items:center;gap:8px;letter-spacing:-.03em}
.fcard .old{font-size:12px;color:var(--muted);margin-top:4px}
.fcard .hours{display:inline-block;margin-top:14px;font-family:var(--f-mono);font-size:11.5px;color:var(--brass);background:var(--brass-s);border-radius:999px;padding:1px 11px;font-weight:600}
.fcard .desc{font-size:14px;margin-top:10px}
.fcard .desc2{font-size:13px;margin-top:6px;color:var(--muted)}
.st-band{border-top:1px solid var(--line2)}
.st-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 24px;align-items:end;margin-bottom:30px;position:relative}
.st-head .num{font-family:var(--f-display);font-weight:900;font-size:76px;line-height:.85;color:var(--c);grid-row:span 3;letter-spacing:-.05em}
.st-head .ey{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--c)}
.st-head .sn{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3.4vw,38px);color:var(--ink);line-height:1.15;letter-spacing:-.035em}
.st-head .ss{color:var(--muted);font-size:14px}
.st-head .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;grid-row:span 3}
.sbadge{display:inline-block;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:999px;padding:4px 12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,262px),1fr));gap:16px}
.cgroup{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--c);display:flex;align-items:center;gap:12px;margin-top:8px}
.cgroup::after{content:"";flex:1;height:1px;background:var(--line)}
.ccard{background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:22px 22px 20px;position:relative;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s}
.band.alt .ccard{background:var(--bg)}
.ccard::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.ccard:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:transparent}
.ccard .ct{display:flex;gap:8px;align-items:flex-start}
.ccard .t{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:17.5px;color:var(--ink);line-height:1.35;letter-spacing:-.025em}
.ccard .old{font-size:12px;color:var(--muted);margin-top:4px}
.ccard .hours{align-self:flex-start;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border-radius:999px;padding:1px 10px;margin-top:12px}
.ccard .desc{font-size:13.5px;margin-top:12px;line-height:1.65}
.ccard .notes{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.ccard .notes li{font-size:12.5px;color:var(--text);background:var(--surface2);border-radius:9px;padding:7px 10px;position:relative}
.okmark{flex:none;font-size:10.5px;font-weight:700;color:var(--ok);background:var(--ok-s);border-radius:999px;padding:2px 8px;border:0;line-height:1.5;margin-top:3px}
.okmark.off{color:var(--muted);background:var(--surface2);border:1px dashed var(--line)}
.memo{font-size:12px;background:var(--memo);color:var(--memo-ink);border-radius:8px;padding:5px 10px;margin-top:10px;display:inline-block}
.memo::before{content:"메모  ";font-weight:700}
.st-head .memo{margin:0}
.add-studio{width:100%;border:1.5px dashed var(--line);border-radius:22px;background:none;color:var(--muted);padding:28px;font-size:15px}
.add-studio:hover{border-color:var(--brass-b);color:var(--brass)}
.ccolor{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}

/* ---------- 수강료 ---------- */
.fee-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}
.fee-sum div{background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:20px 22px}
.fee-sum b{display:block;font-family:var(--f-display);font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.fee-sum span{font-size:12.5px;color:var(--muted)}
.fee-grp td{background:transparent!important;padding-top:26px;color:var(--c);font-weight:700;font-size:13px;letter-spacing:.04em;border-bottom:2px solid var(--c)}
.fee-total{font-weight:700;color:var(--ink);font-family:var(--f-display);font-size:15px}
.fee-sub{display:block;font-size:11px;color:var(--muted);font-weight:500;font-family:var(--f-body)}

/* ---------- 권한 ---------- */
.ptable td,.ptable th{vertical-align:middle}
.ptable input[type=text],.ptable select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface);width:100%;min-width:90px}
.ptable input[type=checkbox]{width:18px;height:18px;accent-color:var(--brass-b)}
.ptable td.c,.ptable th.c{text-align:center}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12px;color:var(--muted)}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.locked{font-size:11px;color:var(--muted)}

/* ---------- 사이트 푸터 ---------- */
.sitefoot{background:var(--hero);color:var(--hero-mut);font-size:13px}
.sitefoot .wrap{padding-block:56px max(40px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px}
.sitefoot .fb{font-family:var(--f-display);font-weight:900;font-size:22px;color:#fff;letter-spacing:-.03em}
.sitefoot .fl{display:flex;flex-wrap:wrap;gap:6px 18px;align-content:flex-start}
.sitefoot .fl button{background:none;border:0;padding:0;color:var(--hero-mut);font-size:13.5px}
.sitefoot .fl button:hover{color:#fff}
.sitefoot .fcopy{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.1);padding-top:20px;font-size:12px}
.sitefoot [contenteditable]:empty::before{color:var(--hero-mut)}

/* ---------- 편집 ---------- */
.editing [data-p][contenteditable]{outline:1px dashed color-mix(in srgb,var(--blue) 40%,transparent);outline-offset:3px;border-radius:3px;cursor:text;min-width:20px}
.editing [data-p][contenteditable]:hover{background:var(--blue-s)}
.editing [data-p][contenteditable]:focus{outline:2px solid var(--focus);background:var(--blue-s)}
.editing .hero [data-p][contenteditable],.editing .aibox [data-p][contenteditable],.editing .sitefoot [data-p][contenteditable]{outline-color:rgba(255,255,255,.35)}
[data-p][contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7;font-weight:400}
.it-tools{position:absolute;top:8px;right:8px;display:flex;gap:2px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s}
.editing .has-tools:hover>.it-tools,.editing .has-tools:focus-within>.it-tools{opacity:1}
.it-tools button{background:none;border:0;width:24px;height:24px;border-radius:6px;font-size:12px;color:var(--muted);padding:0;line-height:1}
.it-tools button:hover{background:var(--surface2);color:var(--ink)}
.it-tools button.del:hover{color:var(--danger);background:var(--danger-s)}
.has-tools{position:relative}
.add{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:10px;padding:6px 13px;font-size:13px;margin-top:12px}
.add:hover{border-color:var(--brass-b);color:var(--brass)}
.add.block{display:flex;width:100%;justify-content:center;padding:14px;border-radius:14px}
.add.inline{margin:0 0 0 4px;padding:2px 8px}
.add.onhero{color:var(--hero-mut);border-color:rgba(255,255,255,.25);margin:0}
.ed-field{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:baseline}
.ed-field>span:first-child{flex:none;font-family:var(--f-mono)}
.tone-sel{font-size:11.5px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:1px 4px;color:var(--text)}
.dock{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:6px;background:var(--hero);color:var(--hero-fg);border-radius:999px;padding:7px 8px 7px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);max-width:calc(100vw - 24px);overflow-x:auto}
.dock .dl{font-size:12.5px;font-weight:700;color:var(--brass-b);white-space:nowrap;margin-right:6px;display:flex;align-items:center;gap:8px}
.dock .dl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brass-b);box-shadow:0 0 0 4px rgba(194,155,72,.25)}
.dock button{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;white-space:nowrap}
.dock button:hover{background:rgba(255,255,255,.16)}
.dock button:disabled{opacity:.35;cursor:default}
.dock button.end{background:var(--brass-b);color:#1a1205;font-weight:700}
.dock .ss{font-family:var(--f-mono);font-size:11px;color:var(--hero-mut);white-space:nowrap;padding:0 6px}
.drawer-bg{position:fixed;inset:0;background:rgba(5,10,18,.45);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);z-index:81;box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) 22px;overflow-y:auto}
.drawer h3{margin:0;font-family:var(--f-display);color:var(--ink);font-size:21px}
.drawer .dsub{font-size:13px;color:var(--muted);margin:4px 0 18px}
.drawer label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:14px 0 6px}
.drawer input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.mrow{display:flex;align-items:center;gap:6px;padding:8px;border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.mrow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface)}
.mrow input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;flex:none}
.mrow .ty{font-size:10.5px;color:var(--muted);font-family:var(--f-mono);flex:none}
.dclose{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:16px;background:none;border:0;font-size:22px;color:var(--muted)}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,18,.55);display:grid;place-items:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--surface);color:var(--text);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(480px,100%);padding:28px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font-family:var(--f-display);color:var(--ink);font-size:21px}
.modal p{margin:0 0 16px;font-size:14px;color:var(--muted)}
.modal label{display:block;font-size:12.5px;font-weight:700;margin:14px 0 6px;color:var(--ink)}
.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.modal .err{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:1em}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px}
.choice:hover{border-color:var(--brass-b);background:var(--brass-s)}
.choice b{display:block;color:var(--ink);font-size:14px}
.choice span{font-size:12.5px;color:var(--muted)}
.tb-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
.tb-btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:999px;font-size:13px;z-index:120;box-shadow:var(--shadow-h)}


/* ---------- 가로 보드 ---------- */
.rm-main{padding-bottom:64px}
.rm-main .bh .no:empty{display:none}
.rm-bar{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;margin:-14px 0 22px}
.vsw{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.vsw button{border:0;background:none;border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:600;color:var(--muted)}
.vsw button.on{background:var(--ink);color:var(--surface)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bnav{margin-left:auto;display:flex;gap:6px}
.board-scroll{overflow-x:auto;padding:4px max(24px,env(safe-area-inset-left,0px)) 18px;scroll-behavior:smooth;cursor:grab;scrollbar-width:thin}
.board-scroll.drag{cursor:grabbing;scroll-behavior:auto;user-select:none}
.editing .board-scroll{cursor:auto}
.board{display:flex;gap:16px;align-items:stretch;width:max-content;margin:0 auto}
.bfound{width:236px;flex:none;display:flex;flex-direction:column;gap:12px}
.bfl{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;padding:6px 2px 0}
.bfcard{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:18px;position:relative}
.bfcard .ftag{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--blue)}
.bfcard .ft{font-family:var(--f-display);font-weight:900;font-size:19px;color:var(--ink);margin-top:4px;display:flex;align-items:center;gap:8px;line-height:1.25}
.bfcard .old{font-size:11.5px;color:var(--muted);margin-top:3px}
.bfcard .hours{display:inline-block;margin-top:10px;font-family:var(--f-mono);font-size:11px;color:var(--brass);background:var(--brass-s);border-radius:999px;padding:1px 10px;font-weight:600}
.bfcard .desc{font-size:13px;margin-top:8px;line-height:1.6}
.bfcard .desc2{font-size:12px;margin-top:4px;color:var(--muted)}
.barrow{flex:none;align-self:center;width:34px;height:34px;border-radius:50%;background:var(--brass-b);color:#fff;display:grid;place-items:center;font-size:15px}
.bcol{width:288px;flex:none;background:var(--surface);border:1px solid var(--line2);border-radius:20px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bch{padding:20px 20px 16px;position:relative;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 92%,#fff 8%),color-mix(in srgb,var(--c) 60%,#050B14));color:#fff;isolation:isolate;overflow:hidden}
.bch::before{content:"";position:absolute;right:-25%;top:-60%;width:80%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.22);z-index:-1}
.bch .bci{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;opacity:.85}
.bch .sn{font-family:var(--f-display);font-weight:900;font-size:21px;margin-top:6px;line-height:1.2;letter-spacing:-.03em}
.bch .ss{font-size:12.5px;opacity:.85}
.bch .sbadge{margin-top:10px;color:#fff;background:rgba(255,255,255,.18)}
.bch .memo{margin-top:8px}
.bcolor{position:absolute;top:14px;right:14px;border-color:rgba(255,255,255,.4)}
.editing .bch [data-p][contenteditable]{outline-color:rgba(255,255,255,.45)}
.bcb{padding:4px 18px 16px;display:flex;flex-direction:column;flex:1}
.bcb .cgroup{margin-top:16px;font-size:10.5px}
.bcourse{padding:14px 0;border-bottom:1px solid var(--line2);position:relative}
.bcourse:last-of-type{border-bottom:0}
.bcourse .ct{display:flex;gap:6px;align-items:flex-start}
.bcourse .t{flex:1;min-width:0;font-weight:700;font-size:14.5px;color:var(--ink);line-height:1.4;letter-spacing:-.02em}
.bcourse .old{font-size:11.5px;color:var(--muted);margin-top:2px}
.bcourse .hours{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--c);margin-top:6px}
.bcourse .desc{font-size:12.8px;margin-top:5px;line-height:1.6}
.bcourse .notes{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.bcourse .notes li{font-size:11.5px;background:var(--surface2);border-radius:8px;padding:6px 9px;position:relative}
.bcourse .memo{font-size:11.5px;margin-top:7px}
.bcol-add{width:200px;flex:none;border:1.5px dashed var(--line);border-radius:20px;background:none;color:var(--muted);font-size:14px}
.bcol-add:hover{border-color:var(--brass-b);color:var(--brass)}
.bhint{font-size:12.5px;color:var(--muted);margin-top:6px}
@media (max-width:900px){.bnav{display:none}.bcol{width:260px}.bfound{width:220px}}
@media (max-width:900px){
  .head .wrap{flex-wrap:wrap;height:auto;padding-block:10px 0;gap:10px 16px}
  .menu{order:3;flex-basis:100%;margin-inline:-6px;padding-bottom:6px}
  .hright{margin-left:auto}
  .chipu small,.chipu .nm{display:none}
  .wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .hero .wrap{padding-block:56px 48px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .band{padding-block:56px}
  .bh{grid-template-columns:auto minmax(0,1fr)}.bh .no{font-size:40px}.bh .sub{grid-column:1/-1;text-align:left}
  .st-head{grid-template-columns:auto minmax(0,1fr)}.st-head .num{font-size:54px}.st-head .side{grid-column:1/-1;grid-row:auto;align-items:flex-start}
  .flow{grid-template-columns:1fr}.flow-step{display:none}
  .sitefoot .wrap{grid-template-columns:1fr}
  .aibox{padding:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}


/* ===== AIX 홍대 시그니처: 차분한 무채색 바탕 + 지점 대표색 한 가지(테마로 선택) + 굵은 고딕 제목 + 모듈 칸 무늬 ===== */
:root{
  --f-display:"Gothic A1","Pretendard","IBM Plex Sans KR",sans-serif;
  --bg:#F5F5F3; --surface:#FFFFFF; --surface2:#EEEEEB; --ink:#16181B; --text:#3A3E44; --muted:#72767D; --line:#D9DAD6; --line2:#E8E8E5;
  --head-bg:rgba(245,245,243,.86); --hero-fg:#F4F5F3; --hero-mut:#AEB4B1;
  /* 기본 테마: 그린 */
  --acc:#0E7C66; --acc-t:#0B6654; --acc-s:rgba(14,124,102,.1); --acc2:#B9E4D6; --hero:#0D1F1B; --hero2:#163A31;
}

/* ===== 글씨: 사이트 안에서 고르는 글씨체 · 제목 굵기 · 글자 크기 ===== */
:root{--font-main:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--font-head:var(--font-main);--hw:700;
  --f-body:var(--font-main);--f-display:var(--font-head);--f-mono:var(--font-main);--text:#3B4048}
:root[data-font="noto"]{--font-main:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
:root[data-font="nanum"]{--font-main:"Nanum Gothic","Noto Sans KR","Malgun Gothic",sans-serif}
:root[data-font="plex"]{--font-main:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif}
:root[data-font="gowun"]{--font-main:"Gowun Dodum","Noto Sans KR","Malgun Gothic",sans-serif}
:root[data-font="serif"]{--font-main:"Pretendard Variable","Pretendard","Noto Sans KR",sans-serif;--font-head:"Noto Serif KR","Nanum Myeongjo",serif}
:root[data-hw="600"]{--hw:600}:root[data-hw="800"]{--hw:800}
:root[data-size="s"] body{zoom:.93}:root[data-size="l"] body{zoom:1.07}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--text:#C9CED3}}
:root[data-theme="dark"]{--text:#C9CED3}
body{font-family:var(--font-main);letter-spacing:-.005em;line-height:1.72;color:var(--text)}
h1,h2,h3,h4,.hero h1,.bh h2,.gtitle h2,.gch-n,.gf-t,.gsec-h h2,.gc-t,.tile h4,.mcard h4,.aibox .concl,.callout.concept,.logo .lt,.sitefoot .fb,.drawer h3,.modal h3,.l-n,.s-t,.lbar h2,.ph h1,.ph-stats dd,.stats b,.fn,.fg-h h3,.ds-h h2{font-family:var(--font-head);font-weight:var(--hw)!important;letter-spacing:-.025em}
.gc-t,.s-t,.fn,td.strong,.gfg{font-family:var(--font-main)}
.gc-t,.s-t{font-weight:calc(var(--hw) - 100)!important}
.kicker,.ph-k,.gf-tag,.gf-label,.g-grp,.mcard .code,.aibox .tagline,.l-no,.s-tag,.toc-t{letter-spacing:.08em;font-weight:600}
.gsec-n,.g-hrs,.gc-h,.s-h,.mcard .hrs{font-family:var(--font-main);font-weight:600;letter-spacing:0}
.hero h1{line-height:1.22}
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fontpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.fontpick button b{font-size:17px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.fontpick button span{font-size:11.5px;color:var(--muted);font-family:var(--font-main)}
.fontpick button.on,.seg button.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:13px;color:var(--ink)}

/* 안내 줄 모양 */
.g-notes,.s-notes{gap:5px!important}
.g-notes li.nl,.s-notes li.nl{background:none;border:0;border-radius:0;padding:0;font-size:12.5px;color:var(--text);position:relative;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.nl>span:first-of-type{flex:1;min-width:0}
li.nl-bullet{padding-left:12px!important}
li.nl-bullet::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--c,var(--acc))}
li.nl-bold{font-weight:700;color:var(--ink)!important}
li.nl-point{background:var(--acc-s)!important;color:var(--acc-t)!important;font-weight:600;border-radius:7px!important;padding:5px 9px!important}
li.nl-gray{background:var(--bg)!important;border-radius:8px!important;padding:6px 9px!important}
li.nl-warn{background:var(--memo)!important;color:var(--memo-ink)!important;border-radius:7px!important;padding:5px 9px!important}
.nl-sel{margin-left:auto;font-size:11px}

/* 커리큘럼(단계별) 보기 */
/* 노선도 레인 */

.lbar{display:flex;align-items:baseline;gap:10px 18px;flex-wrap:wrap;margin-bottom:16px}
.lbar h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--ink);letter-spacing:-.03em}
.lsub{color:var(--muted);font-size:13px}
.lbar .legend{margin-left:auto;display:flex;gap:16px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.lbar .legend span{display:inline-flex;align-items:center;gap:6px}
.lg-pin{width:12px;height:12px;border-radius:50%;border:3px solid var(--acc);display:inline-block;background:var(--bg)}
.lg-pin.on{background:var(--acc)}
.lbar .bnav{display:flex;gap:6px}
.lanes{overflow-x:auto;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface);cursor:grab;scrollbar-width:thin}
.lanes.drag{cursor:grabbing;user-select:none}
.editing .lanes{cursor:auto}
.lanes-in{width:max-content;min-width:100%}
.lane{display:flex;border-bottom:1px solid var(--line2);position:relative}
.lane:last-child{border-bottom:0}
.lhead{position:sticky;left:0;z-index:4;width:232px;flex:none;background:var(--surface);padding:22px 20px 22px max(24px,env(safe-area-inset-left,0px));border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:3px;box-shadow:8px 0 16px -12px rgba(0,0,0,.18)}
.lhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.l-no{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:600}
.l-n{font-family:var(--f-display);font-weight:900;font-size:21px;color:var(--ink);letter-spacing:-.04em;line-height:1.2}
.l-s{font-size:13px;color:var(--muted)}
.l-c{font-size:12px;color:var(--text);margin-top:8px;font-variant-numeric:tabular-nums}
.l-b{align-self:flex-start;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:6px;padding:3px 8px}
.lhead .memo{align-self:flex-start;margin-top:6px}
.lhead .ccolor{margin-top:8px}
.lane.found .lhead{background:var(--surface2)}
.lane.found{background:var(--surface2)}
.ltrack{display:flex;position:relative;padding:20px 28px 22px 10px}
.ltrack::before{content:"";position:absolute;left:0;right:28px;top:33px;height:2px;background:var(--c);opacity:.55}
.stop{width:256px;flex:none;padding:0 16px;position:relative}
.stop .pin{display:block;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--c);margin:5px 0 14px;position:relative;z-index:1}
.lane.found .stop .pin{background:var(--surface2)}
.stop.ok .pin{background:var(--c)}
.s-tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:2px}
.s-t{display:flex;gap:6px;align-items:flex-start;font-weight:800;color:var(--ink);font-size:15px;line-height:1.35;letter-spacing:-.02em}
.s-t>span:first-child{flex:1;min-width:0}
.s-old{font-size:11.5px;color:var(--muted);margin-top:3px}
.s-h{font-family:var(--f-mono);font-size:11px;color:var(--c);font-weight:600;margin-top:7px}
.lane.found .s-h{color:var(--acc-t)}
.s-d{font-size:12.8px;margin-top:6px;line-height:1.6;color:var(--text)}
.s-d2{font-size:12px;margin-top:4px;color:var(--muted)}
.s-notes{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.s-notes li{font-size:11.5px;background:var(--bg);border-left:2px solid var(--c);padding:5px 8px;position:relative}
.stop .memo{margin-top:8px;font-size:11.5px}
.gtag{flex:none;align-self:flex-start;margin-top:4px;padding:0 6px;position:relative;z-index:1}
.gtag span{display:inline-block;writing-mode:vertical-rl;background:var(--c);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:10px 4px;letter-spacing:.04em}
.add-stop{display:flex;align-items:flex-start;padding-top:24px}
.okmark{margin-top:2px}

.lanes{border:1px solid var(--line2);border-radius:20px;box-shadow:0 1px 2px rgba(16,24,22,.04),0 12px 32px rgba(16,24,22,.07)}
.lane:first-child .lhead{border-top-left-radius:20px}.lane:last-child .lhead{border-bottom-left-radius:20px}
.cswitch{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-size:13.5px;font-weight:600;color:var(--ink)}
.cswitch .kn{width:36px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.cswitch .kn::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.cswitch.on{border-color:var(--acc);background:var(--acc-s)}
.cswitch.on .kn{background:var(--acc)}.cswitch.on .kn::after{left:17px}
.gtitle .legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.gtitle .legend span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:900px){.lhead{width:150px;padding:18px 12px 18px 16px}.l-n{font-size:17px}.stop{width:228px}.gtitle .legend{display:none}}

/* 오른쪽 아이콘 버튼 */
.hright.icons{gap:2px}
.ibtn{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
.ibtn:hover{background:var(--surface2);color:var(--ink)}
.ibtn.on{background:var(--acc-s);color:var(--acc-t)}
.ibtn[data-act="edit"].on{background:var(--acc);color:#fff}
.isep{width:1px;height:22px;background:var(--line);margin:0 6px}
.avbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}

.um-h b{color:var(--ink);font-size:14px}.um-h span{font-size:12px;color:var(--muted)}
.menu-add{width:30px;height:30px;padding:0!important;border:1px dashed var(--line)!important;border-radius:8px!important;color:var(--muted)!important;align-self:center}
/* 로드맵 ↔ 학과 페이지 연결 */
.gch-link{display:inline-block;margin-top:10px;margin-left:6px;background:none;border:0;padding:0;font-size:12px;font-weight:700;color:var(--c);vertical-align:middle}
.gch-link:hover{text-decoration:underline}
.gch-link.mk{border:1px dashed var(--c);border-radius:6px;padding:3px 8px}
.lk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.lk-card{background:var(--bg);border-radius:14px;padding:16px 16px 14px;position:relative;border-top:3px solid var(--c)}
.lk-t{display:flex;gap:8px;align-items:flex-start;font-weight:700;color:var(--ink);font-size:14.5px;line-height:1.4}
.lk-t>span:first-child{flex:1;min-width:0}
.linkbtn2{background:none;border:0;padding:0;margin-left:8px;color:var(--acc-t);font-weight:700;font-size:12.5px}
.linkbtn2:hover{text-decoration:underline}
.gsec-n span{font-size:16px}

/* ===== 첫 화면 배너 v2 : 오로라 / 단색 / 밝은 배너 ===== */
:root{--hero-h:#fff}
:root[data-skin="navy"]{--acc:#2F5FB8;--acc-t:#264F9C;--acc-s:rgba(47,95,184,.09);--acc2:#C7D7F4;--hero:#0B1424;--hero2:#16294A}
:root[data-skin="plum"]{--acc:#6C4FB0;--acc-t:#5A4196;--acc-s:rgba(108,79,176,.09);--acc2:#DCD0F5;--hero:#130F21;--hero2:#2A1F45}
:root[data-skin="green"]{--acc:#0F8268;--acc-t:#0C6C57;--acc2:#BDEBDD;--hero:#0A1A16;--hero2:#123A30}
@media (prefers-color-scheme: dark){
 :root[data-skin="navy"]:not([data-theme="light"]){--acc:#7FA4EE;--acc-t:#9DBAF3;--acc-s:rgba(127,164,238,.13);--acc2:#24375E;--hero:#070D18;--hero2:#132443}
 :root[data-skin="plum"]:not([data-theme="light"]){--acc:#A88BE8;--acc-t:#BEA6F0;--acc-s:rgba(168,139,232,.13);--acc2:#33285A;--hero:#0D0A17;--hero2:#241B3D}}
:root[data-theme="dark"][data-skin="navy"]{--acc:#7FA4EE;--acc-t:#9DBAF3;--acc-s:rgba(127,164,238,.13);--acc2:#24375E;--hero:#070D18;--hero2:#132443}
:root[data-theme="dark"][data-skin="plum"]{--acc:#A88BE8;--acc-t:#BEA6F0;--acc-s:rgba(168,139,232,.13);--acc2:#33285A;--hero:#0D0A17;--hero2:#241B3D}
.hero{background:linear-gradient(125deg,var(--hero) 0%,var(--hero) 40%,var(--hero2) 100%);isolation:isolate;border-bottom:0}
.hero::before{inset:0;filter:none;opacity:1;-webkit-mask-image:none;mask-image:none;background:
  radial-gradient(40% 75% at 86% 12%,color-mix(in srgb,var(--acc) 60%,transparent) 0%,transparent 70%),
  radial-gradient(34% 65% at 66% 108%,color-mix(in srgb,var(--acc2) 32%,transparent) 0%,transparent 70%),
  radial-gradient(26% 55% at 102% 88%,color-mix(in srgb,var(--acc) 40%,transparent) 0%,transparent 70%)}
.hero::after{background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(55% 95% at 84% 40%,#000 0%,transparent 75%);mask-image:radial-gradient(55% 95% at 84% 40%,#000 0%,transparent 75%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:56px;align-items:center}
.hero .wrap>*{grid-column:1}
.hero h1{color:var(--hero-h);margin:18px 0 14px}
.hero p.lead{color:var(--hero-mut)}
.hero .kicker{display:inline-flex;width:fit-content;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 14px 6px 10px;color:var(--acc2);letter-spacing:.1em;font-size:11px}
.hero .kicker::before{width:7px;height:7px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.hero .meta{margin-top:26px}
.hero .meta>span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px!important;padding:6px 14px;color:var(--hero-fg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-weight:500}
.hstats{grid-column:2!important;grid-row:1 / span 5;display:grid;grid-template-columns:repeat(3,auto);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:22px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hstats div{padding:24px 30px 22px;border-left:1px solid rgba(255,255,255,.1);min-width:118px}
.hstats div:first-child{border-left:0}
.hstats b{display:block;font-family:var(--font-head);font-size:40px;font-weight:var(--hw);color:var(--hero-h);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hstats span{display:block;margin-top:10px;font-size:12.5px;color:var(--hero-mut)}
.hstats div:last-child b{color:var(--acc2)}
:root[data-hero="solid"] .hero{background:var(--hero)}
:root[data-hero="solid"] .hero::before{background:radial-gradient(30% 60% at 92% 0%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%)}
:root[data-hero="solid"] .hero::after{display:none}
:root[data-hero="light"] .hero{background:linear-gradient(125deg,var(--surface) 0%,color-mix(in srgb,var(--acc) 7%,var(--surface)) 100%);border-bottom:1px solid var(--line2);--hero-h:var(--ink);--hero-fg:var(--ink);--hero-mut:var(--muted)}
:root[data-hero="light"] .hero::before{opacity:.45}
:root[data-hero="light"] .hero::after{background-image:radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1px,transparent 1.3px)}
:root[data-hero="light"] .hero .kicker{background:var(--acc-s);border-color:transparent;color:var(--acc-t)}
:root[data-hero="light"] .hero .kicker::before{background:var(--acc);box-shadow:none}
:root[data-hero="light"] .hero .meta>span{background:var(--surface);border-color:var(--line)}
:root[data-hero="light"] .hstats{background:var(--surface);border-color:var(--line2);box-shadow:0 1px 2px rgba(16,24,22,.04),0 14px 36px rgba(16,24,22,.08)}
:root[data-hero="light"] .hstats div{border-left-color:var(--line2)}
:root[data-hero="light"] .hstats div:last-child b{color:var(--acc)}
:root[data-hero="light"] .editing .hero [data-p][contenteditable]{outline-color:color-mix(in srgb,var(--blue) 40%,transparent)}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.hstats{grid-column:1!important;grid-row:auto;margin-top:28px;justify-self:start}.hstats div{padding:16px 18px;min-width:0}.hstats b{font-size:28px}}

/* ===== 좌우 이동 막대 (화면 아래 따라다님) ===== */
.gboard-scroll,.lanes{scrollbar-width:none;-ms-overflow-style:none}
.gboard-scroll::-webkit-scrollbar,.lanes::-webkit-scrollbar{display:none}
.hbar{position:sticky;bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;width:min(760px,100%);margin:14px auto 0;padding:7px 10px;background:var(--head-bg);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line2);border-radius:999px;box-shadow:0 10px 30px rgba(16,24,22,.12);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.editing .hbar{bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 66px)}
.hb-btn{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink);display:grid;place-items:center;transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.hb-btn:hover{background:var(--acc);color:#fff}
.hb-btn:active{transform:scale(.92)}
.hb-track{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;height:14px;scrollbar-width:thin;scrollbar-color:var(--acc) var(--surface2);max-width:100%;border-radius:99px}
.hb-track::-webkit-scrollbar{height:10px}
.hb-track::-webkit-scrollbar-track{background:var(--surface2);border-radius:99px}
.hb-track::-webkit-scrollbar-thumb{background:var(--acc);border-radius:99px;border:2px solid var(--surface2)}
.hb-in{height:1px}
.hb-tip{flex:none;font-size:11.5px;color:var(--muted);padding-right:6px;white-space:nowrap}
@media (max-width:700px){.hb-tip{display:none}}
/* ===== 부드러운 움직임 ===== */
:root{--ease:cubic-bezier(.22,.61,.36,1)}
html{scroll-behavior:smooth}
body{transition:background-color .35s var(--ease),color .35s var(--ease)}
main.enter{animation:pageIn .5s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.enter .gcol,main.enter .lane,main.enter .gsec,main.enter .gfcard{animation:riseIn .55s var(--ease) both}
main.enter .gcol:nth-child(3),main.enter .lane:nth-child(2),main.enter .gsec:nth-child(2){animation-delay:.04s}
main.enter .gcol:nth-child(4),main.enter .lane:nth-child(3),main.enter .gsec:nth-child(3){animation-delay:.08s}
main.enter .gcol:nth-child(5),main.enter .lane:nth-child(4),main.enter .gsec:nth-child(4){animation-delay:.12s}
main.enter .gcol:nth-child(6),main.enter .lane:nth-child(5),main.enter .gsec:nth-child(5){animation-delay:.16s}
main.enter .gcol:nth-child(7),main.enter .lane:nth-child(6),main.enter .gsec:nth-child(6){animation-delay:.2s}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.gboard-scroll,.lanes{scroll-behavior:smooth}
.gboard-scroll.drag,.lanes.drag{scroll-behavior:auto}
button,.ibtn,.hbtn,.chip,.gch-link,.toc button,.menu button{transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .25s var(--ease),transform .2s var(--ease)}
.gcol,.gfcard,.gsec,.mcard,.tile,.lk-card{transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s var(--ease)}
.gcol:hover,.gfcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(16,24,22,.05),0 22px 44px rgba(16,24,22,.11)}
.gcourse{transition:background-color .25s var(--ease)}
.gcourse:hover{background:color-mix(in srgb,var(--c) 5%,transparent);border-radius:10px}
.stop{transition:transform .3s var(--ease)}
.stop:hover{transform:translateY(-2px)}
.stop .pin{transition:transform .3s var(--ease),background-color .3s var(--ease)}
.stop:hover .pin{transform:scale(1.18)}
.menu button.on::after{animation:barIn .35s var(--ease) both;transform-origin:center}
@keyframes barIn{from{transform:scaleX(.3);opacity:0}to{transform:none;opacity:1}}
.dd-menu{animation:ddIn .2s var(--ease) both;transform-origin:top right}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.modal-bg{animation:fadeIn .22s var(--ease) both}
.modal{animation:popIn .3s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.drawer-bg{animation:fadeIn .25s var(--ease) both}
.drawer{animation:slideIn .38s var(--ease) both}
@keyframes slideIn{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
.dock{animation:dockIn .35s var(--ease) both}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:toastIn .35s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.it-tools{transition:opacity .2s var(--ease),transform .2s var(--ease);transform:translateY(-2px)}
.editing .has-tools:hover>.it-tools,.editing .has-tools:focus-within>.it-tools{transform:none}
.hero h1,.hero p.lead,.hero .kicker,.hstats{transition:color .3s var(--ease)}
main.enter .hero .kicker{animation:riseIn .5s var(--ease) both}
main.enter .hero h1{animation:riseIn .6s var(--ease) .05s both}
main.enter .hero p.lead{animation:riseIn .6s var(--ease) .1s both}
main.enter .hstats{animation:riseIn .7s var(--ease) .15s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}

/* ===== 공동 사이트 ===== */
.localbar{background:var(--memo);color:var(--memo-ink);font-size:12.5px;text-align:center;padding:7px 16px}
.syncnote{position:fixed;top:calc(env(safe-area-inset-top,0px) + 80px);left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);font-size:13px;padding:9px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.2)}

.um-mail{display:block;padding:0 11px 6px;font-size:12px;color:var(--muted)}

.mg{position:relative;flex:none}

.mg .dd-menu{left:0;right:auto;min-width:220px;transform-origin:top left}

.mdot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
@media (min-width:901px){.menu{overflow:visible}}
.defrole{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.defrole label{font-size:13px;font-weight:600;color:var(--ink)}
.defrole select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface)}
.hnew{display:flex;gap:8px}.hnew input{flex:1;min-width:0}
.hlist{display:flex;flex-direction:column;gap:4px}
.hgrp{font-size:12px;font-weight:700;color:var(--acc-t);margin:12px 0 4px}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--bg)}

/* ===== 선명한 컬러 머리 (시안 2) ===== */
:root[data-skin="vivid"]{--acc:#7C6CFF;--acc-t:#5B4BE0;--acc-s:rgba(124,108,255,.12);--acc2:#B8AEFF;--hero:#0E1222;--hero2:#151A30;--bg:#F1F3F7;--surface:#FFFFFF;--surface2:#F1F3F7;--ink:#12141C;--text:#3E4252;--muted:#5F6478;--line:#DADDE6;--line2:#E6E8EE;--head-bg:#0E1222;--hero-fg:#FFFFFF;--hero-mut:#C3C8DA}

:root[data-theme="dark"][data-skin="vivid"]{--acc:#9A8CFF;--acc-t:#B4AAFF;--acc-s:rgba(154,140,255,.16);--acc2:#B8AEFF;--hero:#090C17;--hero2:#121729;--bg:#0D1020;--surface:#161A2C;--surface2:#1C2136;--ink:#F1F2F7;--text:#C9CDDA;--muted:#9AA0B8;--line:#2A2F46;--line2:#22273B;--head-bg:#090C17}
/* 머리: 어두운 띠 */
.head{background:var(--hero);border-bottom:1px solid rgba(255,255,255,.06)}
.head .logo .lt{color:#fff}.head .logo .ls{color:#9AA0B8}
.head .logo .mk::before{background:var(--acc)}.head .logo .mk::after{background:#fff;opacity:.9}
.head .menu button,.head .mg>button{color:#C3C8DA}
.head .menu button:hover,.head .mg>button:hover{background:rgba(255,255,255,.08);color:#fff}
.head .menu button.on,.head .mg>button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;border-radius:10px}
.head .menu button.on::after,.head .mg>button.on::after{display:none}
.head .mg-c{background:rgba(255,255,255,.12);color:#C3C8DA}
.head .ibtn{color:#C3C8DA}.head .ibtn:hover{background:rgba(255,255,255,.1);color:#fff}
.head .ibtn.on{background:rgba(124,108,255,.25);color:#fff}
.head .ibtn[data-act="edit"].on{background:var(--acc);color:#fff}
.head .isep{background:rgba(255,255,255,.15)}
.head .menu-add{color:#C3C8DA!important;border-color:rgba(255,255,255,.25)!important}
.head .mnav{color:#C3C8DA}
/* 첫 화면: 머리와 이어지는 어두운 판 */
.hero{background:var(--hero)!important;border-bottom:0}
.hero::before,.hero::after{display:none}
.hero .kicker{background:none;border:0;padding:0 0 0 64px;color:#C3C8DA;position:relative;letter-spacing:.1em}
.hero .kicker::before{position:absolute;left:0;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:2px;background:#6E5CF6;box-shadow:12px 0 0 #0E9F87,24px 0 0 #E07B00,36px 0 0 #E43B6E,48px 0 0 #2479E8}

.hero .meta>span{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.hstats{background:none;border:0;box-shadow:none;gap:12px;-webkit-backdrop-filter:none;backdrop-filter:none;overflow:visible}
.hstats div{background:#1A1F35;border:0;border-radius:16px;padding:20px 24px;min-width:110px}
.hstats div:last-child{background:var(--acc)}.hstats div:last-child b{color:#fff}.hstats div:last-child span{color:#ECE9FF}
/* 보드: 컬러 머리 + 따로 떠 있는 과정 카드 */
.gcol{background:transparent;border:0;box-shadow:none;overflow:visible;gap:10px;display:flex;flex-direction:column}
.gcol:hover{transform:none;box-shadow:none}
.gch{background:var(--c);border:0;border-radius:18px;padding:18px 20px;color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--c) 28%,transparent)}
.gch-n{color:#fff}.gch-n::before{display:none}.gch-s{color:rgba(255,255,255,.85)}
.gch-b{background:rgba(255,255,255,.22);color:#fff}
.gch .memo{background:rgba(255,255,255,.92)}
.gch{display:flex;flex-direction:column;align-items:flex-start}.gch-n{align-self:stretch}.gch-link{color:#fff;order:9;margin:10px 0 0;opacity:.92}.gch-link.mk{border-color:rgba(255,255,255,.6)}
.gcb{padding:0;gap:10px}
.gcourse{background:var(--surface);border:0;border-radius:14px;padding:15px 16px;box-shadow:0 1px 3px rgba(18,20,28,.06),0 6px 16px rgba(18,20,28,.05)}
.gcourse:last-of-type{border-bottom:0}
.gcourse:hover{background:var(--surface);transform:translateY(-2px);box-shadow:0 2px 4px rgba(18,20,28,.06),0 14px 28px rgba(18,20,28,.1);border-radius:14px}
.gc-h{color:color-mix(in srgb,var(--c) 82%,#000)}
.g-grp{margin:8px 2px 0}
.gfound .gf-label{background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;font-size:16px;letter-spacing:-.02em;text-transform:none;font-weight:800}
.gfcard{border:0;border-radius:14px;box-shadow:0 1px 3px rgba(18,20,28,.06),0 6px 16px rgba(18,20,28,.05)}
.gf-tag{color:var(--muted)}
.g-hrs{background:var(--surface2);color:var(--ink)}
.garrow{background:var(--ink);border-radius:12px;box-shadow:none}
.gcol-add{border-radius:18px}
/* 커리큘럼 보기 */
.lhead::before{width:6px}
.lanes{border-radius:20px}
/* 수강료 · 학과 자료 */

.lk-card{border-top:0;background:var(--surface2);position:relative;overflow:hidden}
.lk-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.hbar{background:var(--hero);border-color:transparent}
.hb-btn{background:#262A3B;color:#fff}.hb-btn:hover{background:var(--acc)}
.hb-track{scrollbar-color:var(--acc) #262A3B}.hb-track::-webkit-scrollbar-track{background:#262A3B}.hb-track::-webkit-scrollbar-thumb{border-color:#262A3B}
.hb-tip{color:#9AA0B8}
.cswitch.on{background:var(--acc-s)}
.avbtn{background:var(--acc)}

/* ===== 버전 고르기 · 안내 띠 ===== */
.vdd{margin-right:6px}
.verbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:11px;padding:6px 12px;font-size:13px;max-width:240px}
.verbtn.mine{border-color:var(--acc);background:rgba(124,108,255,.18)}

.vb-n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmenu{min-width:300px;max-height:70vh;overflow:auto}
.vmenu .vm-h{font-size:11px;font-weight:700;color:var(--muted);padding:10px 11px 4px;letter-spacing:.04em}
.vmenu button{display:flex!important;align-items:center;gap:10px}
.vmenu button.cur{background:var(--acc-s);font-weight:700}
.vm-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vm-t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.vdot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none;display:inline-block}
.vdot.f{background:#0E9F87;border-radius:2px}.vdot.f.d{background:#E07B00}
.vbar{font-size:13px}
.vbar .wrap{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:9px}
.vbar b{color:var(--ink)}.vbar span{color:var(--muted)}
.vbar-dot{width:8px;height:8px;border-radius:50%;flex:none}
.vbar.mine{background:var(--acc-s)}.vbar.mine .vbar-dot{background:var(--acc)}
.vbar.other{background:#FFF4DE}.vbar.other .vbar-dot{background:#E07B00}
.vbar.final{background:#E4F7F1}.vbar.final .vbar-dot{background:#0E9F87;border-radius:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vbar.other{background:#3A2E14}:root:not([data-theme="light"]) .vbar.final{background:#13342C}}
:root[data-theme="dark"] .vbar.other{background:#3A2E14}:root[data-theme="dark"] .vbar.final{background:#13342C}
.vlink{background:none;border:0;padding:0;color:var(--acc-t);font-weight:700;font-size:12.5px}
.vlink:hover{text-decoration:underline}
.vbar .vlink:first-of-type{margin-left:auto}
.vbtn{border:0;background:var(--ink);color:var(--surface);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700}
.vbar.final .vbtn{background:#0E9F87;color:#fff}

/* ===== 통합 비교 ===== */
.mwrap{padding-block:28px 120px}
.mctl{display:flex;gap:20px 32px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.mctl-l{flex:1 1 480px;min-width:0}
.mctl-r label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.mctl-r small{font-weight:500;color:var(--muted)}
.mctl-r select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:14px;min-width:200px}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.vchip input{width:15px;height:15px;accent-color:var(--acc);margin:0}
.vchip.on{border-color:var(--acc);background:var(--acc-s)}
.mbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mtabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.mtabs button{border:0;background:none;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.mtabs button b{margin-left:4px;font-variant-numeric:tabular-nums}
.mtabs button.on{background:var(--ink);color:var(--surface)}
.mhint{font-size:12.5px;color:var(--muted);margin-left:auto}
.mtbl table{min-width:900px;font-size:13.5px}
.mtbl th{position:sticky;top:0;background:var(--surface2);z-index:1}
.m-base{margin-left:6px;font-size:10.5px;font-weight:700;color:var(--acc-t);background:var(--acc-s);border-radius:5px;padding:1px 6px}
.mtbl td{vertical-align:top;line-height:1.55}
.mtbl td.m-lab{font-weight:600;color:var(--ink);width:260px;font-size:12.8px}
.mtbl td.odd{background:#FFF3C4}
.mtbl td.has{color:#0B7A55;font-weight:700}.mtbl td.none{color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mtbl td.odd{background:#3D3412}}

.m-fin{width:270px}
.m-pick{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.m-pick button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 8px;font-size:12px;color:var(--text)}
.m-pick button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.m-in{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;background:var(--surface)}
.m-empty{color:var(--muted);font-style:normal}
.m-none{text-align:center;color:var(--muted);padding:30px!important}
.mfoot{position:sticky;bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:min(860px,calc(100% - 32px));margin:-90px auto 24px;background:var(--hero);color:#fff;border-radius:16px;padding:12px 14px 12px 20px;box-shadow:0 14px 40px rgba(14,18,34,.3)}
.mfoot b{font-size:18px}.mf-sub{flex:1;font-size:12.5px;color:#9AA0B8;min-width:200px}
.mfoot .hbtn.dark{background:var(--acc);border-color:var(--acc);color:#fff}

.gate-in.wide{width:min(640px,100%);text-align:left}
.gate-in.wide h2,.gate-in.wide>p{text-align:center}

.gate-in .err{color:#B4303E;font-size:12.5px;min-height:1.2em;margin:4px 0}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;color:var(--ink)}
.gbtn:hover{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.gsep{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--muted);font-size:12px}
.gsep::before,.gsep::after{content:"";flex:1;height:1px;background:var(--line)}
.gate .linkbtn{display:block;margin:14px auto 0;background:none;border:0;color:var(--acc-t);font-weight:700;font-size:13px}
/* 미리 써 보기 */
.ppl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 8px}
.pplb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--ink)}
.pplb:hover{border-color:var(--acc);background:var(--acc-s)}
.localbar .linkbtn{background:none;border:0;padding:0;margin-left:8px;color:inherit;font-weight:700;text-decoration:underline}
/* 머리 메뉴가 넘치지 않게 · 버전 단추는 아래 띠로 */
.head .wrap{height:auto;min-height:68px;padding-block:8px;flex-wrap:wrap;row-gap:4px}
.head .menu{flex-wrap:wrap;row-gap:4px}
.head .menu button,.head .mg>button{padding:8px 12px}
.vbar .vdd{margin:0}
.vbar .verbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:9px}
.vbar .verbtn.mine{border-color:var(--acc);background:var(--surface)}
.vbar .vb-k{color:var(--muted)}
.vbar .vmenu{left:0;right:auto;transform-origin:top left}
/* 담당자 이름 칸 */
.gchips{flex-basis:100%;margin-top:6px}
.pchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pc-l{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:600;transition:background .2s,border-color .2s,color .2s}
.pchip:hover{border-color:var(--acc)}
.pchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pchip.fin.on{background:#0E9F87;border-color:#0E9F87}
.pchip small{font-size:10.5px;font-weight:700;background:rgba(224,123,0,.15);color:#B86200;border-radius:5px;padding:0 5px}
.pchip.on small{background:rgba(255,255,255,.25);color:#fff}
.pc-f{width:8px;height:8px;border-radius:2px;background:#0E9F87}
.pchip.on .pc-f{background:#fff}
.pchip.add{border-style:dashed;color:var(--acc-t);background:none}
.pc-sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.pc-hint{font-size:12.5px;color:var(--muted);margin-left:4px}
.pinfo{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.pi-t{color:var(--muted)}
.vlink.del{color:#B4303E}
.vstrip{background:var(--surface);border-bottom:1px solid var(--line2)}
.vstrip .wrap{padding-block:12px}
.gtitle{flex-wrap:wrap}
select.pend{border-color:#E07B00!important;background:#FFF4DE!important}
</style>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const br=s=>esc(s).replace(/\n/g,'<br>');
function getP(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function setP(p,v){const ks=p.split('.');const last=ks.pop();const o=ks.reduce((o,k)=>o[k],S);o[last]=v}

function load(){
  let saved=null,local=null;
  try{saved=JSON.parse($('#saved').textContent||'null')}catch(e){}
  try{local=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
  const best=[saved,local].filter(x=>x&&x.menus).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0))[0];
  S=best?best:defaultData();normAll();
  try{const v=localStorage.getItem(STORE+'-view');if(v)ui.rmView=v}catch(e){}
  try{const t=localStorage.getItem(THEME);if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
  const vis=visibleMenus();ui.menu=vis[0]?vis[0].id:null;
  try{const h=decodeURIComponent(location.hash.slice(1));if(h&&vis.find(m=>m.id===h))ui.menu=h}catch(e){}
}
