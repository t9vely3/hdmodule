  `:'<p class="hint">글씨·색·사이트 이름은 관리자만 바꿀 수 있습니다. 아래 메뉴는 내 버전에만 적용됩니다.</p>'}<label>메뉴 · 카테고리</label><p class="hint" style="margin:0 0 10px">카테고리 이름을 같게 적은 메뉴는 위쪽 메뉴에서 하나의 펼침 메뉴로 묶입니다.</p><datalist id="grp-list">${[...new Set(S.menus.map(m=>m.group).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist>${rows}<button class="add block" data-act="add-menu">＋ 메뉴 추가</button></aside>`;
}
function fmtAt(t){const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function siteFooter(vis){
  const m=S.menus.find(x=>x.id===ui.menu),i=S.menus.indexOf(m);
  return `<footer class="sitefoot"><div class="wrap"><div><div class="fb">${esc(S.brand.title)}</div><div style="margin-top:6px">${esc(S.brand.sub)}</div></div><div class="fl">${vis.map(x=>`<button data-act="nav" data-id="${x.id}">${esc(menuName(x))}</button>`).join('')}</div><div class="fcopy">${m?T('menus.'+i+'.footer','span','','페이지 하단 문구',{keep:1}):'SBS Academy · 홍대지점'}${Cloud.versions&&Cloud.versions[ui.vid]&&Cloud.versions[ui.vid].at?`<span class="lastedit">${esc(verLabel(Cloud.versions[ui.vid]))} · 마지막 저장 ${esc(Cloud.versions[ui.vid].by||'')} · ${fmtAt(Cloud.versions[ui.vid].at)}</span>`:''}</div></div></footer>`;
}
function paintSave(){const el=$('#save-state');if(!el)return;if(dirty){el.textContent='저장 중…'}else if(lastSavedLocal){el.textContent='저장됨 '+lastSavedLocal.toTimeString().slice(0,5)}else el.textContent='자동 저장'}
function paintUndo(){const b=$('#undo-btn');if(b)b.disabled=!hist.length}

function page(){
  if(ui.menu==='__perm')return permPage();
  if(ui.menu==='__merge')return mergePage();
  const i=S.menus.findIndex(m=>m.id===ui.menu);
  if(i<0)return `<section class="band"><div class="wrap"><p>볼 수 있는 메뉴가 없습니다. 로그인하거나 관리자에게 권한을 요청하세요.</p></div></section>`;
  const m=S.menus[i],p='menus.'+i;
  if(m.type==='roadmap')return roadmap(m,p);
  if(m.type==='fees')return fees(m,p);
  return doc(m,p);
}
function glow(cols){const c=cols.filter(Boolean);return `--c1:${esc(c[0]||'#C29B48')};--c2:${esc(c[1]||c[0]||'#2E8BC7')};--c3:${esc(c[2]||'#7B68B5')}`}
function hero(p,extra,cols){
  return `<section class="hero" style="${glow(cols||[])}"><div class="wrap"><div class="kicker">${E()?`<span data-p="${p}.kicker" contenteditable="true" spellcheck="false" data-ph="머리글">${esc(getP(p+'.kicker'))}</span>`:esc(getP(p+'.kicker'))}</div>${T(p+'.title','h1','','제목',{keep:1})}${T(p+'.desc','p','lead','설명')}${extra||''}</div></section>`;
}
function bh(no,ey,titleHtml,subHtml,toolsHtml){
  return `<div class="bh has-tools">${toolsHtml||''}<div class="no">${no}</div><div class="ey">${ey}</div><div class="sub">${subHtml||''}</div>${titleHtml}</div>`;
}

/* ---------- 공통 (강남 구성 유지 · 고급형) ---------- */
function okMark(q,c){if(E())return `<button class="okmark ${c.ok?'':'off'}" data-act="toggle" data-p="${q}.ok" title="확정 표시 켜기/끄기">${c.ok?'확정':'미확정'}</button>`;return c.ok?'<span class="okmark">확정</span>':''}
function num(s){const m=String(s==null?'':s).replace(/,/g,'').match(/[\d.]+/);return m?parseFloat(m[0]):NaN}
function feeCalc(r){const mo=num(r.monthly),n=num(r.months);if(isNaN(mo)||isNaN(n))return null;return {man:mo*n,plus:/\+|α/.test(r.months)}}
const won=man=>'₩'+Math.round(man*10000).toLocaleString('ko-KR');
function miniTools(arr,i){return `<button class="icon-btn" data-act="move" data-arr="${arr}" data-i="${i}" data-d="-1" aria-label="위로">↑</button><button class="icon-btn" data-act="move" data-arr="${arr}" data-i="${i}" data-d="1" aria-label="아래로">↓</button><button class="icon-btn" data-act="dup" data-arr="${arr}" data-i="${i}" aria-label="복제">⧉</button><button class="icon-btn" data-act="del" data-arr="${arr}" data-i="${i}" aria-label="삭제">✕</button>`}
function gsec(no,titleHtml,subHtml,toolsHtml,body){return `<section class="gsec has-tools">${toolsHtml||''}<div class="gsec-h"><span class="gsec-n">${no}</span>${titleHtml}${subHtml?`<span class="gsec-s">${subHtml}</span>`:''}</div>${body}</section>`}


function stop(c,q,arr,i,isF){
  const notes=(c.notes||[]).map((n,ni)=>noteLi(q+'.notes',ni,n)).join('');
  return `<article class="stop ${c.ok?'ok':''} has-tools">${tools(arr,i)}<span class="pin" aria-hidden="true"></span>
   ${isF?T(q+'.tag','div','s-tag','구분'):''}<div class="s-t">${T(q+'.title','span','','과정명',{keep:1})}${okMark(q,c)}</div>${T(q+'.old','div','s-old','기존 과정명 (선택)')}${T(q+'.hours','div','s-h','시수 (선택)')}${T(q+'.desc','div','s-d','설명')}${isF?T(q+'.desc2','div','s-d2','보충 설명'):''}
   ${notes?`<ul class="s-notes">${notes}</ul>`:''}${!isF&&E()?addBtn(q+'.notes','note','줄 추가','inline'):''}${T(q+'.memo','span','memo','메모 (선택)')}
   ${!isF&&E()?`<div class="ed-field"><span>구분</span>${T(q+'.group','span','','구분 제목 (선택)',{rr:1})}</div>`:''}</article>`;
}
function stageLanes(m,p){
  const fq=p+'.foundation';
  const fl=`<div class="lane found" style="--c:var(--muted)"><div class="lhead"><div class="l-no">00</div>${T(fq+'.label','div','l-n','이름',{keep:1})}<div class="l-s">모든 스튜디오 공통</div><div class="l-c">${m.foundation.cards.length}과정</div></div><div class="ltrack">${m.foundation.cards.map((c,i)=>stop(c,`${fq}.cards.${i}`,fq+'.cards',i,true)).join('')}${E()?`<div class="stop add-stop">${addBtn(fq+'.cards','fcard','파운데이션 추가')}</div>`:''}</div></div>`;
  const lanes=m.studios.map((s,si)=>{const q=`${p}.studios.${si}`;let lastG=null;
    const stops=s.courses.map((c,ci)=>{let g='';if(c.group&&c.group!==lastG)g=`<div class="gtag"><span>${esc(c.group)}</span></div>`;lastG=c.group;return g+stop(c,`${q}.courses.${ci}`,q+'.courses',ci,false)}).join('');
    return `<div class="lane" style="--c:${esc(s.color)}"><div class="lhead has-tools">${tools(p+'.studios',si)}<div class="l-no">${String(si+1).padStart(2,'0')}</div>${T(q+'.name','div','l-n','스튜디오 이름',{keep:1})}${T(q+'.sub','div','l-s','부제')}<div class="l-c">${s.courses.length}과정 · 확정 ${s.courses.filter(c=>c.ok).length}</div>${(()=>{const pg=pageFor(s.id);return pg?`<button class="gch-link" data-act="studio-page" data-sid="${s.id}">설명자료 →</button>`:(E()&&can('menus')?`<button class="gch-link mk" data-act="studio-page" data-sid="${s.id}">＋ 학과 페이지</button>`:'')})()}${T(q+'.badge','span','l-b','안내 배지 (선택)')}${T(q+'.memo','span','memo','메모 (선택)')}${E()?`<input type="color" class="ccolor" aria-label="스튜디오 색" data-p="${q}.color" value="${esc(s.color)}">`:''}</div><div class="ltrack">${stops}${E()?`<div class="stop add-stop">${addBtn(q+'.courses','course','과정 추가')}</div>`:''}</div></div>`}).join('');
  return `<div class="lanes" id="board" tabindex="0" aria-label="커리큘럼 단계, 좌우로 스크롤"><div class="lanes-in">${fl}${lanes}</div></div>${E()?`<button class="add" data-act="add" data-arr="${p}.studios" data-tpl="studio">＋ 스튜디오 추가</button>`:''}`;
}
/* ---------- 전체 로드맵 : 파운데이션 → 스튜디오 칸 가로 보드 ---------- */
function roadmap(m,p){
  const stg=ui.rmView==='stage';
  const all=m.studios.flatMap(s=>s.courses);const nOk=all.filter(c=>c.ok).length;
  const meta=`<div class="hstats"><div><b>${m.studios.length}</b><span>스튜디오</span></div><div><b>${all.length}</b><span>전체 과정</span></div><div><b>${nOk}</b><span>확정 과정</span></div></div>`;
  const fq=p+'.foundation';
  const fc=m.foundation.cards.map((c,i)=>{const q=`${fq}.cards.${i}`;
    return `<div class="gfcard has-tools">${tools(fq+'.cards',i)}<div class="gf-t">${T(q+'.title','span','','이름',{keep:1})}${okMark(q,c)}</div>${T(q+'.tag','div','gf-tag','영문 구분')}${T(q+'.old','div','g-old','기존 과정명')}${T(q+'.hours','span','g-hrs','시수')}${T(q+'.desc','p','g-desc','설명')}${T(q+'.desc2','p','g-desc2','보충 설명')}</div>`}).join('');
  const cols=m.studios.map((s,si)=>{const q=`${p}.studios.${si}`;let lastG=null;
    const cs=s.courses.map((c,ci)=>{const cq=`${q}.courses.${ci}`;let g='';
      if(c.group&&c.group!==lastG)g=`<div class="g-grp">${esc(c.group)}</div>`;lastG=c.group;
      const notes=(c.notes||[]).map((n,ni)=>noteLi(cq+'.notes',ni,n)).join('');
      return `${g}<div class="gcourse has-tools">${tools(q+'.courses',ci)}<div class="gc-t">${T(cq+'.title','span','','과정명',{keep:1})}${okMark(cq,c)}</div>${T(cq+'.old','div','g-old','기존 과정명 (선택)')}${T(cq+'.hours','div','gc-h','시수 (선택)')}${T(cq+'.desc','p','g-desc','설명')}${notes?`<ul class="g-notes">${notes}</ul>`:''}${E()?addBtn(cq+'.notes','note','줄 추가','inline'):''}${T(cq+'.memo','span','memo','메모 (선택)')}${E()?`<div class="ed-field"><span>구분</span>${T(cq+'.group','span','','구분 제목 (선택)',{rr:1})}</div>`:''}</div>`}).join('');
    return `<section class="gcol has-tools" style="--c:${esc(s.color)}">${tools(p+'.studios',si)}<div class="gch">${E()?`<input type="color" class="ccolor gcolor" aria-label="스튜디오 색" data-p="${q}.color" value="${esc(s.color)}">`:''}${(()=>{const pg=pageFor(s.id);return pg?`<button class="gch-link" data-act="studio-page" data-sid="${s.id}">설명자료 →</button>`:(E()&&can('menus')?`<button class="gch-link mk" data-act="studio-page" data-sid="${s.id}">＋ 학과 페이지 만들기</button>`:'')})()}<div class="gch-n">${T(q+'.name','span','','이름',{keep:1})}${T(q+'.sub','span','gch-s','부제')}</div>${T(q+'.badge','span','gch-b','안내 배지 (선택)')}${T(q+'.memo','span','memo','메모 (선택)')}</div><div class="gcb">${cs}${addBtn(q+'.courses','course','과정 추가')}</div></section>`}).join('');
  return `${hero(p,meta)}<div class="gwrap">
   <div class="gtitle">${T(p+'.boardTitle','h2','','보드 제목',{keep:1})}${T(p+'.boardSub','span','gsub','보드 설명')}${stg?'<div class="legend"><span><i class="lg-pin on"></i>확정</span><span><i class="lg-pin"></i>미확정</span></div>':''}<button class="cswitch ${stg?'on':''}" data-act="stage" role="switch" aria-checked="${stg}"><span class="kn" aria-hidden="true"></span>커리큘럼으로 보기</button>${Cloud.on&&!Cloud.needSetup&&Cloud.ready?`<div class="gchips">${verChips()}</div>`:''}</div>
   ${stg?stageLanes(m,p):`<div class="gboard-scroll" id="board" tabindex="0" aria-label="로드맵 보드, 좌우로 스크롤"><div class="gboard">
    <div class="gfound">${T(fq+'.label','div','gf-label','라벨',{keep:1})}${fc}${addBtn(fq+'.cards','fcard','파운데이션 추가')}</div>
    <div class="garrow" aria-hidden="true">→</div>${cols}${E()?`<button class="gcol-add" data-act="add" data-arr="${p}.studios" data-tpl="studio">＋ 스튜디오 추가</button>`:''}</div></div>`}
   ${hbar()}</div>`;
}

/* ---------- 수강료표 ---------- */
function fees(m,p){
  const body=m.groups.map((g,gi)=>{const q=`${p}.groups.${gi}`;
    const head=`<tr class="g-feegrp" style="--c:${esc(g.color)}"><td colspan="6"><span class="gfg">${E()?`<input type="color" aria-label="분류 색" data-p="${q}.color" value="${esc(g.color)}" class="ccolor sm">`:'<i></i>'}${T(q+'.name','span','','분류명',{keep:1})}${E()?`<span class="f-tools">${miniTools(p+'.groups',gi)}</span>`:''}</span></td></tr>`;
    const rows=g.rows.map((r,ri)=>{const rq=`${q}.rows.${ri}`,c=feeCalc(r);
      const mon=isNaN(num(r.monthly))?esc(r.monthly):esc(num(r.monthly))+'만';
      return `<tr><td class="strong">${T(rq+'.course','span','','과정명',{keep:1})}${T(rq+'.sub','span','g-fsub','보충 (선택)')}</td><td class="num">${T(rq+'.totalH','span','','—',{keep:1})}</td><td class="num">${T(rq+'.monthH','span','','—',{keep:1})}</td><td class="num">${T(rq+'.months','span','','—',{keep:1,rr:1})}</td><td class="num">${E()?`<span data-p="${rq}.monthly" data-rr="1" contenteditable="true" spellcheck="false" data-ph="만원">${esc(r.monthly)}</span><span class="g-fsub">만원 단위 숫자</span>`:mon}</td><td class="num g-tot">${c?`${(Math.round(c.man*10)/10).toLocaleString('ko-KR')}만원${c.plus?'+α':''}<span class="g-fsub">${won(c.man)}${c.plus?' (기본 기준)':''}</span>`:'<span class="g-none">미정</span>'}${E()?`<div class="f-tools">${miniTools(q+'.rows',ri)}</div>`:''}</td></tr>`}).join('');
    return head+rows+(E()?`<tr><td colspan="6">${addBtn(q+'.rows','feerow','과정 행 추가','inline')}</td></tr>`:'');}).join('');
  return `${hero(p)}<div class="wrap gnarrow"><section class="gsec"><div class="tbl-wrap g-fee"><table><thead><tr><th>과정</th><th class="num">총시간</th><th class="num">시간(월)</th><th class="num">운영개월</th><th class="num">월 수강료</th><th class="num">총 수강료</th></tr></thead><tbody>${body}</tbody></table></div>${addBtn(p+'.groups','feegroup','분류 추가')}</section></div>`;
}

/* ---------- 학과별 설명자료 : 번호 섹션 카드 ---------- */
function doc(m,p){
  const meta=`<div class="meta">${(m.hero.meta||[]).map((x,i)=>`<span>${E()?`<span data-p="${p}.hero.meta.${i}" contenteditable="true" spellcheck="false">${esc(x)}</span> <button class="icon-btn" style="background:none;color:var(--hero-mut);border-color:rgba(255,255,255,.2);padding:0 5px" data-act="del" data-arr="${p}.hero.meta" data-i="${i}" aria-label="삭제">✕</button>`:esc(x)}</span>`).join('')}${E()?`<button class="add inline onhero" data-act="add" data-arr="${p}.hero.meta" data-tpl="meta">＋ 태그</button>`:''}</div>`;
  const secs=m.sections.map((s,si)=>{const q=`${p}.sections.${si}`;
    const bl=s.blocks.map((b,bi)=>`<div class="blk has-tools">${tools(q+'.blocks',bi)}${block(b,`${q}.blocks.${bi}`)}</div>`).join('');
    return gsec(si+1,T(q+'.title','h2','','섹션 제목',{keep:1}),T(q+'.sub','span','','보조 문구'),tools(p+'.sections',si),bl+(E()?`<button class="add block" data-act="add-block" data-arr="${q}.blocks">＋ 이 섹션에 블록 추가</button>`:''))}).join('');
  return `${hero(p+'.hero',meta)}<div class="wrap gnarrow">${linkedBlock(m)}${secs}${addBtn(p+'.sections','section','섹션 추가','block')}</div>`;
}

function block(b,q){
  const title=T(q+'.title','div','blk-t','블록 소제목 (선택)');
  switch(b.type){
  case 'callout':return title+`<div class="callout ${b.style||'info'}">${E()?`<select class="tone-sel" data-p="${q}.style" aria-label="모양" style="float:right">${['info','concept','summary','plain'].map(v=>`<option value="${v}" ${b.style===v?'selected':''}>${{info:'안내',concept:'강조',summary:'요약',plain:'일반 문단'}[v]}</option>`).join('')}</select>`:''}${T(q+'.text','div','','내용',{keep:1})}</div>`;
  case 'bullets':return title+`<ul class="bul">${b.items.map((x,i)=>`<li class="has-tools">${tools(q+'.items',i)}${T(q+'.items.'+i,'span','','항목',{keep:1})}</li>`).join('')}</ul>${addBtn(q+'.items','bullet','항목')}`;
  case 'flow':return title+`<div class="flow" style="--n:${b.cols.length||1}">${b.cols.map((c,ci)=>{const cq=`${q}.cols.${ci}`;return `<div class="fcol ${c.tone} has-tools">${tools(q+'.cols',ci)}${T(cq+'.label','div','fl','단계 이름',{keep:1})}${E()?`<select class="tone-sel" data-p="${cq}.tone" aria-label="색" style="margin:0 0 4px">${[['tool','기초'],['mod','실무'],['proj','완성(어두운 칸)']].map(([v,n])=>`<option value="${v}" ${c.tone===v?'selected':''}>${n}</option>`).join('')}</select>`:''}${c.items.map((it,ii)=>`<span class="chip has-tools">${tools(cq+'.items',ii)}${T(cq+'.items.'+ii+'.name','span','','과정명',{keep:1})}${T(cq+'.items.'+ii+'.sub','small','','보충')}</span>`).join('')}${addBtn(cq+'.items','flowitem','칩')}${ci<b.cols.length-1?'<span class="flow-step" aria-hidden="true">→</span>':''}</div>`}).join('')}</div>${addBtn(q+'.cols','flowcol','단계 칸')}${T(q+'.note','p','note-line','하단 안내 (선택)')}`;
  case 'tiles':return title+`<div class="tiles">${b.items.map((x,i)=>`<div class="tile has-tools">${tools(q+'.items',i)}${b.numbered?`<div class="tn">${String(i+1).padStart(2,'0')}</div>`:''}${T(q+'.items.'+i+'.title','h4','','제목',{keep:1})}${T(q+'.items.'+i+'.text','p','','내용')}</div>`).join('')}</div>${addBtn(q+'.items','tile','카드')}`;
  case 'effects':return title+`<div class="tiles eff">${b.items.map((x,i)=>`<div class="tile has-tools">${tools(q+'.items',i)}${T(q+'.items.'+i+'.title','h4','','제목',{keep:1})}${T(q+'.items.'+i+'.text','p','','내용')}</div>`).join('')}</div>${addBtn(q+'.items','tile','항목')}`;
  case 'table':return title+tableBlock(b,q);

function localBackend(){
  const KEY=STORE+'-localdb',UKEY=STORE+'-localuser';
  let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  const cp=x=>JSON.parse(JSON.stringify(x));const listeners=[];
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast('이 브라우저 저장 공간이 가득 찼습니다. 오래된 기록이 지워질 수 있습니다')}};
  const deliver=()=>setTimeout(()=>listeners.forEach(l=>{const docs=Object.entries(store).filter(([id,d])=>l.kinds.includes(d.kind)).map(([id,d])=>({id,data:()=>cp(d)}));l.cb({forEach:f=>docs.forEach(f)})}),0);
  const put=(id,d,o)=>{store[id]=o&&o.merge?Object.assign({},store[id]||{},cp(d)):cp(d)};
  const docRef=id=>({id,async get(){return {exists:!!store[id],data:()=>cp(store[id])}},async set(d,o){put(id,d,o);save();deliver()},async delete(){delete store[id];save();deliver()}});
  const db={collection(){return {doc:docRef,where(f,op,kinds){return {onSnapshot(cb){const l={kinds,cb};listeners.push(l);deliver();return()=>{const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}}}}},
    batch(){const ops=[];return {set(r,d,o){ops.push(()=>put(r.id,d,o))},delete(r){ops.push(()=>{delete store[r.id]})},async commit(){ops.forEach(o=>o());save();deliver()}}},
    async runTransaction(fn){await fn({get:r=>r.get(),set:(r,d)=>put(r.id,d)});save();deliver()}};
  let user=null;try{user=JSON.parse(localStorage.getItem(UKEY)||'null')}catch(e){}
  const al=[];const setU=u=>{user=u;try{localStorage.setItem(UKEY,JSON.stringify(u))}catch(e){}al.forEach(c=>c(u))};
  const auth={get currentUser(){return user},onAuthStateChanged(cb){al.push(cb);setTimeout(()=>cb(user),0)},
    async signInWithEmailAndPassword(name){name=String(name||'').trim();if(!name)throw {code:'auth/invalid-email'};setU({uid:'l_'+encodeURIComponent(name).replace(/%/g,''),email:'',displayName:name})},
    async createUserWithEmailAndPassword(n){return auth.signInWithEmailAndPassword(n)},
    async signOut(){setU(null)}};
  return {db,auth,people:()=>Object.entries(store).filter(([k,v])=>v.kind==='member').map(([k,v])=>v.name),wipe(){store={};save();setU(null)}};
}

function ensureIds(x){if(Array.isArray(x)){x.forEach(o=>{if(o&&typeof o==='object'&&!Array.isArray(o)&&!o.id&&!o._k)o._k=Math.random().toString(36).slice(2,9);ensureIds(o)})}else if(x&&typeof x==='object')Object.keys(x).forEach(k=>{if(k!=='_k')ensureIds(x[k])})}
const nameOf=o=>o&&(o.name||o.title||o.course||o.t||o.label||o.k||o.code||'');
function flatten(menus){
  const fields={},objs={};
  function walk(o,path,label,objPath){
    for(const key of Object.keys(o)){if(SKIPK.has(key))continue;const v=o[key];
      if(Array.isArray(v)){
        if(v.length&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){
          v.forEach((x,i)=>{const p=path+'/'+key+'#'+(x._k||x.id||i);const lb=label+' › '+(String(nameOf(x)).slice(0,40)||((LBL[key]||key)+' '+(i+1)));objs[p]={label:lb,parent:path,key,idx:i};walk(x,p,lb,p)});
        }else if(v.some(Array.isArray)){v.forEach((r,i)=>{fields[path+'/'+key+'['+i+']']={label:label+' › '+(LBL[key]||key)+' '+(i+1),val:Array.isArray(r)?r.join(' | '):String(r),obj:objPath,raw:r}})}
        else fields[path+'/'+key]={label:label+' › '+(LBL[key]||key),val:v.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(', '),obj:objPath,raw:v};
      }else if(v&&typeof v==='object')walk(v,path+'/'+key,label+(LBL[key]?' › '+LBL[key]:''),objPath);
      else fields[path+'/'+key]={label:label+' › '+(LBL[key]||key),val:v===true?'예':v===false?'아니오':String(v==null?'':v),obj:objPath,raw:v};
    }
  }
  menus.forEach((m,i)=>{const p='menus#'+m.id;objs[p]={label:m.name||'메뉴',parent:'',key:'menus',idx:i};walk(m,p,m.name||'메뉴',p)});
  return {fields,objs};
}
function resolve(root,path,create){ // path: '' | 'menus#id/foundation/cards#k/title'
  const segs=path.split('/').filter(Boolean);let o=root,parent=null,last=null;
  for(const sg of segs){parent=o;last=sg;const m=sg.match(/^([^#\[]+)(?:#(.+)|\[(\d+)\])?$/);if(!m)return null;const key=m[1];
    if(m[2]!==undefined){const arr=o[key];if(!Array.isArray(arr))return null;o=arr.find((x,i)=>String(x._k||x.id||i)===m[2]);if(!o)return null}
    else if(m[3]!==undefined){if(!Array.isArray(o[key]))return null;o=o[key][+m[3]];if(o===undefined)return null}
    else{if(o[key]===undefined&&!create)return o===undefined?null:{__miss:true,parent:o,key};o=o[key]}}

function setAt(root,path,val){const i=path.lastIndexOf('/');const pp=path.slice(0,i),leaf=path.slice(i+1);const host=pp?resolve(root,pp):root;if(!host||host.__miss)return false;
  const m=leaf.match(/^([^\[]+)\[(\d+)\]$/);if(m){if(!Array.isArray(host[m[1]]))return false;host[m[1]][+m[2]]=clone(val);return true}host[leaf]=clone(val);return true}
function compareVersions(vids){
  const F=vids.map(v=>flatten(JSON.parse(Cloud.versions[v].data).menus||[]));
  const objKeys=new Set(),fieldKeys=new Set();F.forEach(f=>{Object.keys(f.objs).forEach(k=>objKeys.add(k));Object.keys(f.fields).forEach(k=>fieldKeys.add(k))});
  const inAll=k=>!k||F.every(f=>f.objs[k]);
  const objRows=[];[...objKeys].forEach(k=>{if(inAll(k))return;const any=F.find(f=>f.objs[k]).objs[k];if(!inAll(any.parent))return;
    objRows.push({key:'o:'+k,path:k,label:any.label,has:F.map(f=>!!f.objs[k])})});
  const diff=[],same=[];
  [...fieldKeys].forEach(k=>{const any=F.find(f=>f.fields[k]).fields[k];if(!inAll(any.obj))return;
    const vals=F.map(f=>f.fields[k]?f.fields[k].val:'');const raws=F.map(f=>f.fields[k]?f.fields[k].raw:undefined);
    const row={key:'f:'+k,path:k,label:any.label,vals,raws,bool:typeof any.raw==='boolean'};
    if(vals.every(x=>x===vals[0]))same.push(row);else{const cnt={};vals.forEach(x=>cnt[x]=(cnt[x]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);row.major=top[0][1]>1&&(!top[1]||top[0][1]>top[1][1])?top[0][0]:null;diff.push(row)}});
  const byLabel=(a,b)=>a.path.localeCompare(b.path);diff.sort(byLabel);same.sort(byLabel);objRows.sort(byLabel);
  return {diff,same,objRows};
}

    return `<tr class="${p?'done':''}"><td class="m-lab">${esc(r.label)}</td>${r.vals.map(v=>cell(v,r.major!==null?v!==r.major:true)).join('')}<td class="m-fin">${can2?`<div class="m-pick">${vids.map((v,i)=>`<button class="${p&&p.v===v?'on':''}" data-act="mpick" data-k="${esc(r.key)}" data-v="${v}" title="${esc(names[i])} 값 쓰기">${esc(String(names[i]).slice(0,4))}</button>`).join('')}</div><input class="m-in" data-mcustom="${esc(r.key)}" value="${esc(cur)}" placeholder="직접 입력" aria-label="최종본 값">`:`<span>${p?esc(cur):'<span class="m-empty">미정</span>'}</span>`}</td></tr>`}).join('');
  const objRowsH=R.objRows.map(r=>{const p=st.picks[r.key];return `<tr class="${p?'done':''}"><td class="m-lab">${esc(r.label)}</td>${r.has.map(h=>`<td class="${h?'has':'none'}">${h?'있음':'없음'}</td>`).join('')}<td class="m-fin">${can2?`<div class="m-pick"><button class="${p&&p.inc===true?'on':''}" data-act="mobj" data-k="${esc(r.key)}" data-v="1">최종본에 넣기</button><button class="${p&&p.inc===false?'on':''}" data-act="mobj" data-k="${esc(r.key)}" data-v="0">빼기</button></div>`:(p?(p.inc?'넣기':'빼기'):'<span class="m-empty">미정</span>')}</td></tr>`}).join('');

async function buildFinal(){
  const st=mergeState();const vids=st.sources;if(vids.length<2)return;
  const t=await askText('최종본 이름','예: 11월 최종본',st.title||`${new Date().getMonth()+1}월 최종본`);if(t==null)return;
  const R=compareVersions(vids);const datas=vids.map(v=>JSON.parse(Cloud.versions[v].data));
  const root=clone(JSON.parse(Cloud.versions[st.base].data));
  R.objRows.forEach(r=>{const p=st.picks[r.key];if(!p)return;const bi=vids.indexOf(st.base);
    const segs=r.path.split('/');const leaf=segs.pop();const m=leaf.match(/^([^#]+)#(.+)$/);const parentPath=segs.join('/');
    const host=parentPath?resolve(root,parentPath):root;if(!host||host.__miss)return;const arr=host[m[1]];if(!Array.isArray(arr))return;
    const at=arr.findIndex((x,i)=>String(x._k||x.id||i)===m[2]);
    if(p.inc&&at<0){const si=r.has.findIndex(Boolean);const obj=resolve(datas[si],r.path);if(obj&&!obj.__miss){const srcHost=parentPath?resolve(datas[si],parentPath):datas[si];const sidx=srcHost&&Array.isArray(srcHost[m[1]])?srcHost[m[1]].indexOf(obj):arr.length;arr.splice(Math.min(sidx<0?arr.length:sidx,arr.length),0,clone(obj))}}
    if(p.inc===false&&at>=0)arr.splice(at,1)});
  R.diff.forEach(r=>{const p=st.picks[r.key];if(!p)return;let val;
    if(p.v==='__c'){val=p.val;if(r.bool)val=/^(예|true|확정|o|y)/i.test(String(val).trim());else{const ex=r.raws.find(x=>x!==undefined);if(Array.isArray(ex))val=String(val).split(ex.some(Array.isArray)?' | ':', ').map(x=>x.trim());}}
    else{val=r.raws[vids.indexOf(p.v)];if(val===undefined)return}
    setAt(root,r.path,val)});
  const now=Date.now(),id='f_'+now;
  await vdoc('ver_'+id).set({kind:'ver',vtype:'final',status:'draft',title:t.trim()||'최종본',owner:Cloud.user.uid,ownerName:myName(),data:JSON.stringify(root),from:vids,at:now,by:myName()}).catch(e=>{toast(errText(e));throw e});
  saveMerge(Object.assign({},st,{title:t.trim()}));
  Cloud.versions[id]={kind:'ver',vtype:'final',status:'draft',title:t.trim()||'최종본',owner:Cloud.user.uid,data:JSON.stringify(root),at:now};
  ui.menu=null;switchVersion(id);ui.edit=true;render();toast('최종본 초안을 만들었습니다. 다듬은 뒤 위의 "최종본 확정"을 누르세요');
}

function modal(html,onMount){return new Promise(res=>{const root=$('#modal-root');root.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const close=v=>{root.innerHTML='';res(v)};
  root.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))close(null);const b=e.target.closest('[data-m]');if(b)close(b.dataset.m)});
  root.addEventListener('keydown',function k(e){if(e.key==='Escape'){root.removeEventListener('keydown',k);close(null)}});
  if(onMount)onMount(root,close);const f=root.querySelector('input,select,button');if(f)f.focus();});}
const askText=(title,msg,val)=>{let out=val;return modal(`<h3>${title}</h3><p>${msg}</p><input id="ask-t" value="${esc(val||'')}"><div class="acts"><button class="tb-btn" data-m="">취소</button><button class="tb-btn primary" data-m="ok">저장</button></div>`,root=>{const i=root.querySelector('#ask-t');i.addEventListener('input',()=>out=i.value);i.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=root.querySelector('[data-m=ok]');b.click()}})}).then(v=>v==='ok'?out:null)};

  case 'p-del':await deletePerson();break;
  case 'final-done':{const v=Cloud.versions[ui.vid];if(!v)return;if(!(await ask('최종본으로 확정할까요?',`'${esc(v.title||'최종본')}'을 확정하면 읽기 전용이 되고, 담당자들이 이 내용으로 자기 버전을 다시 시작할 수 있습니다.`,'확정')))return;persist();await vdoc('ver_'+ui.vid).set({status:'done',doneAt:Date.now(),doneBy:myName()},{merge:true}).catch(e=>toast(errText(e)));ui.edit=false;toast('최종본으로 확정했습니다');break}
  case 'final-reopen':{await vdoc('ver_'+ui.vid).set({status:'draft'},{merge:true}).catch(e=>toast(errText(e)));toast('다시 고칠 수 있게 열었습니다');break}
  case 'mtab':ui.mtab=el.dataset.v;render();break;
  case 'mpick':{const st=mergeState();const k=el.dataset.k;st.picks=Object.assign({},st.picks);if(st.picks[k]&&st.picks[k].v===el.dataset.v)delete st.picks[k];else st.picks[k]={v:el.dataset.v};saveMerge(st);render();break}
  case 'mobj':{const st=mergeState();const k=el.dataset.k;st.picks=Object.assign({},st.picks);const inc=el.dataset.v==='1';if(st.picks[k]&&st.picks[k].inc===inc)delete st.picks[k];else st.picks[k]={inc};saveMerge(st);render();break}
  case 'm-major':{const st=mergeState();const R=compareVersions(st.sources);let n=0;st.picks=Object.assign({},st.picks);
    R.diff.forEach(r=>{if(st.picks[r.key]||r.major===null)return;const i=r.vals.indexOf(r.major);if(i>=0){st.picks[r.key]={v:st.sources[i]};n++}});
    R.objRows.forEach(r=>{if(st.picks[r.key])return;const c=r.has.filter(Boolean).length;if(c*2!==r.has.length){st.picks[r.key]={inc:c*2>r.has.length};n++}});
    saveMerge(st);render();toast(n?`${n}줄을 많은 쪽 값으로 정했습니다. 남은 줄은 직접 골라 주세요`:'많은 쪽이 분명한 줄이 없습니다');break}
  case 'm-build':{try{await buildFinal()}catch(e){}break}
  case 'cfg-save':{const c=parseCfg(($('#cfg-t')||{}).value);if(!c){$('#cfg-err').textContent='붙여 넣은 내용에서 apiKey와 projectId를 찾지 못했습니다. firebaseConfig 부분을 중괄호까지 통째로 복사해 주세요.';return}
    try{localStorage.setItem(STORE+'-fbcfg',JSON.stringify(c))}catch(e){}Cloud.err='';location.reload();break}
  case 'g-login':await googleLogin();break;
  case 'l-as':await Cloud.auth.signInWithEmailAndPassword(el.dataset.n,'x');break;
  case 'trial':try{localStorage.setItem(STORE+'-trial','1')}catch(e){}location.reload();break;
  case 'go-setup':try{localStorage.removeItem(STORE+'-trial')}catch(e){}location.reload();break;
  case 'g-mode':ui.signup=!ui.signup;render();break;
  case 'studio-page':{const pg=pageFor(el.dataset.sid);if(pg){ui.menu=pg.id;render();window.scrollTo(0,0)}else await makeStudioPage(el.dataset.sid);break}
  case 'herostyle':snap();S.brand.hero=el.dataset.v;changed();render();break;
  case 'font':snap();S.brand.font=el.dataset.v;changed();render();break;
  case 'hw':snap();S.brand.hw=el.dataset.v;changed();render();break;
  case 'tsize':snap();S.brand.size=el.dataset.v;changed();render();break;
  case 'panel':ui.panel=el.dataset.v||null;if(ui.panel==='hist')loadHistIdx();if(ui.panel)FONTS.forEach(f=>loadFont(f[0]));render();break;
  case 'skin':snap();S.brand.skin=el.dataset.v;changed();render();break;
  case 'bscroll':{const b=$('#board');if(b)b.scrollBy({left:(+el.dataset.d)*Math.max(300,b.clientWidth*.7),behavior:'smooth'});break}
  case 'jump':{const t=document.getElementById(el.dataset.to);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});break}
  case 'dd':ui.dd=!ui.dd;render();break;
  case 'theme':{const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem(THEME,n)}catch(e){}break}
  case 'undo':undo();break;
  case 'toggle':snap();setP(el.dataset.p,!getP(el.dataset.p));changed();render();break;
  case 'move':{const arr=getP(el.dataset.arr),i=+el.dataset.i,j=i+(+el.dataset.d);if(j<0||j>=arr.length)return;snap();[arr[i],arr[j]]=[arr[j],arr[i]];changed();render();break}
  case 'dup':{const arr=getP(el.dataset.arr),i=+el.dataset.i;snap();const c=clone(arr[i]);stripK(c);if(el.dataset.arr==='menus'){c.id=newMenuId();c.name+=' 사본'}if(el.dataset.arr==='roles'){c.id='r'+Date.now().toString(36);c.fixed=false;c.name+=' 사본'}arr.splice(i+1,0,c);changed();render();toast('복제했습니다');break}
  case 'del':{const p=el.dataset.arr,arr=getP(p),i=+el.dataset.i;
    if(p==='users'&&arr[i].role==='admin'&&arr.filter(u=>u.role==='admin').length<2){toast('관리자는 최소 한 명 있어야 합니다');return}
    if(p==='roles'&&arr[i].fixed)return;
    if(p==='menus'&&S.menus.length<2){toast('메뉴는 최소 한 개 있어야 합니다');return}
    const label=p==='menus'?`'${esc(arr[i].name)}' 메뉴와 그 안의 내용 전체`:p==='users'?`사용자 '${esc(arr[i].name)}'`:'이 항목';
    if(!(await ask('삭제할까요?',`${label}을(를) 삭제합니다. 실수했다면 상단의 되돌리기로 복구할 수 있습니다.`,'삭제')))return;
    snap();const removed=arr.splice(i,1)[0];
    if(p==='roles'){Object.entries(Cloud.members).forEach(([uid,u])=>{if(u.role===removed.id&&Cloud.db)Cloud.db.collection(COL).doc('member_'+uid).set({role:'editor'},{merge:true}).catch(()=>{})});if(S.defaultRole===removed.id)S.defaultRole='editor';S.menus.forEach(m=>m.hiddenFor=(m.hiddenFor||[]).filter(x=>x!==removed.id))}
    changed();render();toast('삭제했습니다');break}
  case 'add':{const p=el.dataset.arr,tpl=el.dataset.tpl;snap();let v;
    if(tpl==='row'){const t=getP(p.replace(/\.rows$/,''));v=t.cols.map(()=>'')}else v=TPL[tpl]();
    getP(p).push(v);changed();render();break}
  case 'add-col':{const t=getP(el.dataset.path);snap();t.cols.push({name:'새 열',kind:'text'});t.rows.forEach(r=>r.push(''));changed();render();break}
  case 'del-col':{const t=getP(el.dataset.path),c=+el.dataset.c;if(t.cols.length<2){toast('열은 최소 한 개 있어야 합니다');return}
    if(!(await ask('열을 삭제할까요?',`'${esc(t.cols[c].name||'이름 없음')}' 열과 그 칸의 내용이 모두 지워집니다.`,'삭제')))return;
    snap();t.cols.splice(c,1);t.rows.forEach(r=>r.splice(c,1));changed();render();break}
  case 'add-block':{const v=await modal(`<h3>어떤 블록을 넣을까요?</h3><p>섹션 끝에 추가됩니다. 추가 후 ↑ ↓ 로 위치를 옮길 수 있습니다.</p><div class="choices">${Object.entries(BLOCKS).map(([k,b])=>`<button class="choice" data-m="${k}"><b>${b.name}</b><span>${b.desc}</span></button>`).join('')}</div><div class="acts"><button class="tb-btn" data-m="">취소</button></div>`);
    if(!v)return;snap();getP(el.dataset.arr).push(BLOCKS[v].make());changed();render();break}
  case 'add-menu':{const cur=S.menus.find(m=>m.id===ui.menu);
    let cat='';const v=await modal(`<h3>새 메뉴 만들기</h3><p>메뉴 종류를 고르세요. 카테고리를 적으면 위쪽 메뉴에서 같은 카테고리끼리 묶입니다.</p><label for="nm-cat">카테고리 (선택)</label><input id="nm-cat" list="nm-cats" placeholder="예: 학과 자료, 상담 자료" style="margin-bottom:14px"><datalist id="nm-cats">${[...new Set(S.menus.map(m=>m.group).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist><div class="choices">
     <button class="choice" data-m="studio"><b>학과 페이지 (로드맵 스튜디오 연결)</b><span>로드맵의 스튜디오를 골라, 옆 학과 페이지를 복사하거나 빈 틀로 만듭니다. 과정은 로드맵과 연동됩니다</span></button>
     <button class="choice" data-m="doc"><b>설명 페이지 (빈 틀)</b><span>섹션과 블록(표·카드·목록 등)을 자유롭게 쌓는 페이지</span></button>
     <button class="choice" data-m="roadmap"><b>로드맵 보드</b><span>스튜디오 칸에 과정을 나열하는 가로 보드</span></button>
     <button class="choice" data-m="fees"><b>수강료표</b><span>월 수강료 × 개월 자동 계산 표</span></button>
     ${cur?`<button class="choice" data-m="copy"><b>지금 메뉴 복제</b><span>'${esc(cur.name)}' 내용을 그대로 복사해 새 메뉴로</span></button>`:''}</div><div class="acts"><button class="tb-btn" data-m="">취소</button></div>`,root=>{const i=root.querySelector('#nm-cat');i.addEventListener('input',()=>cat=i.value.trim())});
    if(!v)return;if(v==='studio'){await makeStudioPage(cat);return}snap();let m;const id=newMenuId();
    if(v==='copy'){m=clone(cur);m.id=id;m.name=cur.name+' 사본'}
    else if(v==='doc')m={id,type:'doc',name:'새 페이지',color:'#0E7C66',hiddenFor:[],hero:{kicker:'AIX 홍대',title:'새 페이지 제목',desc:'페이지 설명을 입력하세요.',meta:[]},sections:[TPL.section()],footer:'SBS Academy · 홍대지점'};
    else if(v==='roadmap')m={id,type:'roadmap',name:'새 로드맵',color:'#0E7C66',hiddenFor:[],kicker:'AIX 홍대',title:'새 로드맵',desc:'설명을 입력하세요.',boardTitle:'로드맵',boardSub:'',foundation:{label:'공통 파운데이션',cards:[TPL.fcard()]},studios:[TPL.studio()],footer:'SBS Academy · 홍대지점'};
    else m={id,type:'fees',name:'새 수강료표',color:'#0E7C66',hiddenFor:[],kicker:'수강료',title:'새 수강료표',desc:'총 수강료는 월 수강료 × 운영개월로 자동 계산됩니다.',groups:[TPL.feegroup()],footer:'SBS Academy · 홍대지점'};
    if(cat)m.group=cat;S.menus.push(m);ui.menu=id;changed();render();toast('메뉴를 추가했습니다');break}
  case 'login':{if(!Cloud.on)return;ui.menu=ui.menu;Cloud.user=null;render();const f=$('#g-e');if(f)f.focus();break}
  case 'logout':{ui.edit=false;ui.um=false;if(Cloud.on){try{await Cloud.auth.signOut()}catch(e){}}render();toast('로그아웃했습니다');break}
  case 'rename':{if(!Cloud.user)return;const me=Cloud.members[Cloud.user.uid]||{};const v=await askText('표시할 이름','저장 기록과 마지막 수정에 이 이름이 나옵니다.',me.name||myName());if(v==null)return;
    await Cloud.db.collection(COL).doc('member_'+Cloud.user.uid).set({name:v.trim()||myName()},{merge:true}).catch(e=>toast(errText(e)));break}
  case 'mname':{const uid=el.dataset.uid,u=Cloud.members[uid]||{};const v=await askText('팀원 이름 바꾸기',esc(u.email||''),u.name||'');if(v==null)return;
    await Cloud.db.collection(COL).doc('member_'+uid).set({name:v.trim()},{merge:true}).catch(e=>toast(errText(e)));break}
  case 'gdd':ui.gdd=ui.gdd===el.dataset.g?null:el.dataset.g;render();break;
  case 'hist-save':{const memo=($('#h-memo')||{}).value||'';el.disabled=true;try{await saveHist(false,memo.trim());toast('지금 상태를 기록했습니다')}catch(e){toast(errText(e))}render();break}
  case 'hist-restore':{const h=(Cloud.histList||[]).find(x=>x.id===el.dataset.id);if(!h)return;
    if(!(await ask('이 상태로 되돌릴까요?',`${fmtAt(h.at)} ${esc(h.by||'')}님 기록으로 지금 보는 버전 전체가 바뀝니다. 지금 상태는 먼저 자동으로 기록해 두니 언제든 다시 돌아올 수 있습니다.`,'되돌리기')))return;
    try{await saveHist(false,'되돌리기 전 자동 기록');const d=await getHist(h.id);if(!d)throw new Error('기록을 찾지 못했습니다');snap();
      S.menus=d.menus;normAll();persist();ui.panel=null;render();toast(`${fmtAt(h.at)} 상태로 되돌렸습니다`)}catch(e){toast(errText(e))}break}
  case 'hist-dl':{try{const d=await getHist(el.dataset.id);const h=(Cloud.histList||[]).find(x=>x.id===el.dataset.id)||{};const o=clone(S);o.menus=d.menus;download(JSON.stringify(o,null,1),'모듈로드맵_기록_'+stamp(new Date(h.at||Date.now()))+'.json','application/json')}catch(e){toast(errText(e))}break}
  case 'save-now':persist(false);render();toast(Cloud.on?'저장했습니다':'이 브라우저에 저장했습니다');break;
  case 'export-html':exportHTML();render();break;
  case 'export-json':download(JSON.stringify(S,null,1),'홍대지점_모듈로드맵_백업_'+stamp()+'.json','application/json');render();break;
  case 'import-json':{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.menus)throw 0;snap();S.menus=d.menus;normAll();changed();render();toast('백업을 불러왔습니다')}catch(e){toast('이 파일은 백업 파일 형식이 아닙니다')}};rd.readAsText(f)};inp.click();ui.dd=false;render();break}
  case 'reset':{ui.dd=false;render();if(!(await ask('처음 상태로 되돌릴까요?','지금까지 고친 내용이 모두 처음 기본 내용으로 바뀝니다. 되돌리기로 한 번 복구할 수 있습니다.','되돌리기')))return;
    snap();const keepRoles=S.roles,dr=S.defaultRole;S=defaultData();S.roles=keepRoles;S.defaultRole=dr;normAll();changed();render();break}
  }
}
function stamp(d){d=d||new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`}
function download(text,name,type){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('내려받기를 시작했습니다')}
  catch(e){toast('이 화면에서는 내려받기가 막혀 있습니다. 파일로 연 화면에서 다시 시도해 주세요.')}
}
const SRC=document.documentElement.outerHTML;
function exportHTML(){
  persist();
  const doc=new DOMParser().parseFromString(SRC,'text/html');
  doc.querySelector('#app').innerHTML='';doc.querySelector('#modal-root').innerHTML='';
  doc.querySelectorAll('.toast').forEach(x=>x.remove());
  doc.querySelector('#saved').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  doc.documentElement.removeAttribute('data-theme');doc.querySelectorAll('script:not([src])').forEach(sc=>{if(sc.textContent.includes('/*FBCFG*/')){const c=fbConfig();if(c)sc.textContent=sc.textContent.replace(/const FB_CONFIG=[^;]*; \/\*FBCFG\*\//,'const FB_CONFIG='+JSON.stringify(c)+'; /*FBCFG*/')}});
  download('<!DOCTYPE html>\n'+doc.documentElement.outerHTML,'홍대지점_모듈로드맵_'+stamp()+'.html','text/html');
}

/* ================= 이벤트 ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){e.preventDefault();act(el);return}
  if((ui.dd||ui.um||ui.gdd||ui.vdd)&&!e.target.closest('.dd,.mg')){ui.dd=false;ui.um=false;ui.gdd=null;ui.vdd=false;render()}
});
let focusSnap=null;
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-p]');if(el&&focusSnap!==el){focusSnap=el;snap()}});
document.addEventListener('focusout',e=>{const el=e.target.closest('[data-p]');if(el){focusSnap=null;if(ui.pendingApply){setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('[data-p]')))applyPending()},60);return}if(el.dataset.rr||el.dataset.sync)render()}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.msrc){const st=mergeState();let src=st.sources.slice();if(el.checked){if(!src.includes(el.dataset.msrc))src.push(el.dataset.msrc)}else src=src.filter(x=>x!==el.dataset.msrc);if(src.length<2){toast('비교하려면 2개 이상 골라야 합니다');render();return}st.sources=src;if(!src.includes(st.base))st.base=src[0];saveMerge(st);render();return}
  if(el.id==='m-base'){const st=mergeState();st.base=el.value;saveMerge(st);render();return}
  if(el.dataset&&el.dataset.mcustom){const st=mergeState();const k=el.dataset.mcustom;st.picks=Object.assign({},st.picks);const R=compareVersions(st.sources);const r=R.diff.find(x=>x.key===k);const i=r?r.vals.indexOf(el.value):-1;st.picks[k]=i>=0?{v:st.sources[i]}:{v:'__c',val:el.value};saveMerge(st);render()}});
document.addEventListener('submit',e=>{if(e.target.id==='gate-f'){e.preventDefault();doLogin($('#g-e').value.trim(),$('#g-p').value,$('#g-err'),e.target.querySelector('button'))}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.mrole)return;const uid=el.dataset.mrole,v=el.value;
  const admins=Object.entries(Cloud.members).filter(([k,m])=>m.role==='admin');if(admins.length===1&&admins[0][0]===uid&&v!=='admin'){toast('관리자는 최소 한 명 있어야 합니다');render();return}
  Cloud.db.collection(COL).doc('member_'+uid).set({role:v},{merge:true}).then(()=>toast('권한을 바꿨습니다')).catch(x=>toast(errText(x)))});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-p]');if(!el)return;
  if(el.matches('select'))return;
  let v=el.matches('input,textarea')?el.value:(el.innerText!=null?el.innerText:el.textContent).replace(/\n$/,'');
  setP(el.dataset.p,v);changed();
  if(el.type==='color'){const host=el.closest('.studio,.fee-grp');if(host)host.style.setProperty('--c',v)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.perm){const [ri,k]=el.dataset.perm.split('.');snap();S.roles[+ri].perms[k]=el.checked;changed();render();return}
  if(el.dataset.vis){const [mi,rid]=el.dataset.vis.split(':');const m=S.menus[+mi];snap();m.hiddenFor=m.hiddenFor||[];if(el.checked)m.hiddenFor=m.hiddenFor.filter(x=>x!==rid);else if(!m.hiddenFor.includes(rid))m.hiddenFor.push(rid);changed();render();return}
  if(el.matches('select[data-p]')){snap();setP(el.dataset.p,el.value);changed();render();return}
  if(el.matches('input[type=color][data-p]')){render()}
});
document.addEventListener('paste',e=>{const el=e.target.closest&&e.target.closest('[contenteditable="true"]');if(!el)return;e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey&&!e.target.closest('[data-p]')&&(can('edit')||can('menus'))){e.preventDefault();undo()}
  if(e.key==='Enter'&&e.target.matches('[data-p][contenteditable]')&&!e.shiftKey&&!/desc|text|items\.\d+$|note|lead|tag|\.v$|rows\.\d+\.\d+$/.test(e.target.dataset.p)){e.preventDefault();e.target.blur()}
});
let drag=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('#board');if(!b||ui.edit||e.button!==0||e.target.closest('button,a,input,select,[contenteditable]'))return;drag={b,x:e.clientX,l:b.scrollLeft,moved:false}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4){drag.moved=true;drag.b.classList.add('drag')}if(drag.moved)drag.b.scrollLeft=drag.l-dx});
document.addEventListener('pointerup',()=>{if(drag){drag.b.classList.remove('drag');drag=null}});
window.addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(h&&h!==ui.menu&&visibleMenus().find(m=>m.id===h)){ui.menu=h;render()}});

load();cloudInit();if(!Cloud.on){Cloud.authKnown=true;Cloud.ready=true;loadHistIdx()}render();
})();
</script>
</body>
</html>
